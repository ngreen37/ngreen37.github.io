<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJCC: Notation Blitz v3.2</title>
<script src="/assets/js/pjcc-config.js"></script>
<script src="/assets/js/pjcc-profile.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #1a0f3d;
    color: #f0e6ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #stage {
    position: relative;
    width: 560px;
    max-width: 100vw;
  }

  #canvas {
    display: block;
    width: 100%;
    border: 2px solid #F5C518;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(245, 197, 24, 0.2);
    background: #1a0f3d;
    touch-action: manipulation;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20, 12, 45, 0.94);
    border-radius: 6px;
    padding: 22px;
    text-align: center;
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .ov-eyebrow {
    font-size: 10px;
    letter-spacing: 3px;
    color: #9a7fd4;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .ov-title {
    font-size: 34px;
    font-weight: bold;
    color: #F5C518;
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-shadow: 0 0 18px rgba(245,197,24,0.35);
  }

  .ov-sub {
    font-size: 16px;
    color: #c9a7ff;
    line-height: 1.7;
    max-width: 440px;
    margin-bottom: 16px;
  }

  .ov-group-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #F5C518;
    text-transform: uppercase;
    margin: 12px 0 7px;
  }

  .btn-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pick {
    background: #2D1B69;
    color: #c9a7ff;
    border: 1px solid #4a2f8a;
    border-radius: 5px;
    padding: 9px 15px;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .pick:hover { border-color: #F5C518; color: #f0e6ff; }
  .pick.sel {
    background: #F5C518;
    color: #1a0f3d;
    border-color: #F5C518;
    font-weight: bold;
  }

  .pick small { display: block; font-size: 9px; opacity: 0.75; margin-top: 2px; font-weight: normal; }

  .start-btn {
    margin-top: 20px;
    background: #F5C518;
    color: #1a0f3d;
    border: none;
    padding: 13px 36px;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .start-btn:hover { background: #ffd740; box-shadow: 0 0 16px rgba(245,197,24,0.5); }

  .ov-foot {
    margin-top: 16px;
    font-size: 17px;
    color: #c9a7ff;
    line-height: 1.85;
  }
  .ov-foot #title-best { font-size: 18px; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 26px;
    margin: 10px 0 4px;
  }
  .stat-grid .s-lab { font-size: 13px; color: #9a7fd4; text-align: right; }
  .stat-grid .s-val { font-size: 18px; color: #f0e6ff; font-weight: bold; text-align: left; }
  .stat-grid .s-val.perfect { color: #6bffb8; }
  .stat-grid .s-val.great { color: #9bffd0; }
  .stat-grid .s-val.good { color: #F5C518; }
  .stat-grid .s-val.miss { color: #ff6b6b; }
  .timing-grid { gap: 5px 26px; margin: 4px 0; }
  .timing-grid .s-val { font-size: 15px; }

  .rank-badge {
    font-size: 64px;
    font-weight: bold;
    line-height: 1;
    margin: 4px 0 2px;
    text-shadow: 0 0 24px currentColor;
  }
  .fc-badge {
    font-size: 11px;
    letter-spacing: 2px;
    color: #6bffb8;
    border: 1px solid #6bffb8;
    border-radius: 4px;
    padding: 3px 9px;
    margin-top: 4px;
    display: inline-block;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas" width="480" height="500"></canvas>

  <!-- TITLE SCREEN -->
  <div class="overlay" id="title-screen">
    <div class="ov-eyebrow">Checker Town · Coordinate Drill</div>
    <div class="ov-title">NOTATION BLITZ <span style="font-size:0.5em;color:#ff8fd0;vertical-align:super;letter-spacing:1px;">v3.2</span></div>

    <div class="ov-group-label">Tempo</div>
    <div class="btn-row" id="diff-row">
      <button class="pick" data-diff="easy">Slow<small>moonlit</small></button>
      <button class="pick sel" data-diff="medium">Medium<small>golden</small></button>
      <button class="pick" data-diff="hard">Fast<small>crimson</small></button>
    </div>

    <button class="start-btn" id="start-btn">START</button>
    <div class="ov-foot">
      Click the square on the board when its name reaches the gate<br>
      <span id="title-best" style="color:#F5C518;">—</span><br>
      <span id="mute-toggle" style="cursor:pointer;text-decoration:underline;">♪ sound: on</span>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="overlay hidden" id="results-screen">
    <div class="ov-eyebrow" id="res-mode-label">Coordinates · Medium</div>
    <div class="rank-badge" id="res-rank">A</div>
    <div id="res-fc-wrap"><span class="fc-badge">FULL COMBO</span></div>
    <div class="stat-grid">
      <div class="s-lab">Score</div><div class="s-val" id="res-score">0</div>
      <div class="s-lab">Accuracy</div><div class="s-val" id="res-acc">0%</div>
      <div class="s-lab">Max Combo</div><div class="s-val" id="res-combo">0</div>
      <div class="s-lab">Perfect</div><div class="s-val perfect" id="res-perfect">0</div>
      <div class="s-lab">Great</div><div class="s-val great" id="res-great">0</div>
      <div class="s-lab">Good</div><div class="s-val good" id="res-good">0</div>
      <div class="s-lab">Missed</div><div class="s-val miss" id="res-miss">0</div>
    </div>
    <div class="ov-group-label" style="margin-top:4px;">Timing</div>
    <div class="stat-grid timing-grid">
      <div class="s-lab">Early</div><div class="s-val" id="res-early">0</div>
      <div class="s-lab">Late</div><div class="s-val" id="res-late">0</div>
      <div class="s-lab">Avg offset</div><div class="s-val" id="res-timing">—</div>
    </div>
    <div class="ov-foot" id="res-best" style="margin-top:10px;min-height:14px;">&nbsp;</div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="start-btn" id="replay-btn" style="margin-top:0;">REPLAY</button>
      <button class="pick" id="menu-btn" style="align-self:center;">Change mode</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 500;

// ---- Board geometry ----
const TILE = 46;
const BOARD = TILE * 8;            // 368
const BX = (W - BOARD) / 2;        // 56
const BY = 124;                    // board top
const HITX = 150;                  // gate x — pulled toward center, leaving a tail to its left
const TAIL_X = 8;                  // left end of the track; missed calls slide off down the tail
const TRACK_Y = 80;                // center of the rhythm track
const APPROACH = 3.0;              // seconds a call is visible before its hit
const PXPS = (W - 14 - HITX) / APPROACH; // px per second the calls travel

const COLORS = {
  light: '#3d2a7a', dark: '#2D1B69', gold: '#F5C518', goldDim: '#a87d00',
  good: '#6bffb8', bad: '#ff6b6b', text: '#f0e6ff', muted: '#9a7fd4',
};

// Timing windows are a fraction of the gap between calls (computed per game in
// newGame as G.goodW / G.perfectW). Bigger GOOD_FRAC = far more forgiving.
// Accuracy resolves into four bands — Perfect · Great · Good · Early/Late — for a
// more dynamic, timing-driven score (see resolveAt).
const PERFECT_FRAC = 0.16;
const GOOD_FRAC = 0.48;
const GREAT_RATIO = 0.34;   // of the perfect→good span, this much still scores "Great"
const GOOD_RATIO  = 0.68;   // ...up to here is "Good"; beyond, to the edge, is Early/Late

const DIFFS = {
  easy:   { bpm: 43, bpc: 2, calls: 18, label: 'Slow' },
  medium: { bpm: 60, bpc: 2, calls: 22, label: 'Medium' },
  hard:   { bpm: 94, bpc: 2, calls: 28, label: 'Fast' },
};

// Each tempo gets its own palette — board squares, track, accent and backdrop.
const THEMES = {
  easy:   { name: 'moonlit', light: '#27376f', dark: '#1b274f', bg: '#0e1530', accent: '#7fd4ff', rgb: '127,212,255' },
  medium: { name: 'golden',  light: '#3d2a7a', dark: '#2D1B69', bg: '#1a0f3d', accent: '#F5C518', rgb: '245,197,24' },
  hard:   { name: 'crimson', light: '#6d2542', dark: '#481630', bg: '#280c19', accent: '#ff5c8a', rgb: '255,92,138' },
};
let TH = THEMES.medium;     // active theme (set per game in newGame)

const CLIFF_X = 34;         // missed calls tumble off the cliff here, short of the edge

// ---- Personal bests (per mode + tempo), saved in the browser ----
const BEST_KEY = 'pjcc.notation.best.v1';
function loadBests() { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; } }
function saveBests(o) { try { localStorage.setItem(BEST_KEY, JSON.stringify(o)); } catch (e) {} }

// Opening lines — each ply is {san, sq}; sq is the destination square clicked.
const OPENINGS = {
  pirc: { label: 'Pirc Defense', line: [
    ['e4','e4'],['d6','d6'],['d4','d4'],['Nf6','f6'],['Nc3','c3'],['g6','g6'],
    ['f4','f4'],['Bg7','g7'],['Nf3','f3'],['c6','c6'],['Bd3','d3'],['b5','b5'],
    ['e5','e5'],['Nd7','d7'],['Ng5','g5'],['Nb6','b6'],
  ]},
  italian: { label: 'Italian Game', line: [
    ['e4','e4'],['e5','e5'],['Nf3','f3'],['Nc6','c6'],['Bc4','c4'],['Bc5','c5'],
    ['c3','c3'],['Nf6','f6'],['d3','d3'],['d6','d6'],['Bg5','g5'],['Be6','e6'],
    ['Nbd2','d2'],['Qe7','e7'],
  ]},
};

// ---- Coordinate helpers (a1 bottom-left, rank 8 at top) ----
function algToXY(alg) {
  const x = alg.charCodeAt(0) - 97;      // 'a' -> 0
  const y = 8 - parseInt(alg[1], 10);    // rank 8 -> 0
  return { x, y };
}
function xyToAlg(x, y) {
  return String.fromCharCode(97 + x) + (8 - y);
}

// ---- Audio (also the master clock) ----
let actx = null, masterGain = null, soundOn = true;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain();
  masterGain.gain.value = soundOn ? 0.9 : 0;
  masterGain.connect(actx.destination);
}
function nowSec() { return actx ? actx.currentTime : performance.now() / 1000; }

function beep(time, accent) {
  if (!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g); g.connect(masterGain);
  o.type = accent ? 'triangle' : 'sine';
  o.frequency.setValueAtTime(accent ? 660 : 150, time);
  if (accent) o.frequency.exponentialRampToValueAtTime(330, time + 0.06);
  const peak = accent ? 0.5 : 0.42;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, time + (accent ? 0.10 : 0.14));
  o.start(time); o.stop(time + 0.18);
}
function sfx(kind) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(masterGain);
  // Pitch climbs with your streak (up to ~+1 octave), and resets on a miss.
  const semis = Math.min((G ? G.combo : 0), 24);
  const climb = Math.pow(2, semis / 24);
  if (kind === 'perfect') { o.type='triangle'; o.frequency.setValueAtTime(880*climb,t); o.frequency.exponentialRampToValueAtTime(1320*climb,t+0.08); }
  else if (kind === 'good') { o.type='sine'; o.frequency.setValueAtTime(620*climb,t); }
  else { o.type='sawtooth'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(90,t+0.12); }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.3,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.start(t); o.stop(t+0.2);
}

// ---- Game state ----
let G = null;

function newGame(mode, diff) {
  const d = DIFFS[diff];
  // Apply this tempo's theme (board, track accent, backdrop all recolour).
  TH = THEMES[diff] || THEMES.medium;
  COLORS.gold = TH.accent; COLORS.light = TH.light; COLORS.dark = TH.dark;
  try { canvas.style.background = TH.bg; document.body.style.background = TH.bg; } catch (e) {}
  const spb = 60 / d.bpm;
  const queue = [];

  if (mode === 'coords') {
    let prev = -1;
    for (let i = 0; i < d.calls; i++) {
      let x, y, idx;
      do { x = (Math.random()*8)|0; y = (Math.random()*8)|0; idx = y*8+x; } while (idx === prev);
      prev = idx;
      const alg = xyToAlg(x, y);
      queue.push({ san: alg, x, y });
    }
  } else {
    OPENINGS[mode].line.forEach(([san, sq]) => {
      const p = algToXY(sq);
      queue.push({ san, x: p.x, y: p.y });
    });
  }

  const callInterval = spb * d.bpc;   // seconds between successive calls

  G = {
    mode, diff, spb, bpc: d.bpc,
    goodW: callInterval * GOOD_FRAC,
    perfectW: callInterval * PERFECT_FRAC,
    countIn: 4,
    queue, qPtr: 0,
    calls: [],          // active/visible calls
    callBeat: 4,        // first call lands on beat 4 (after count-in)
    beepIdx: 0,
    startTime: 0,
    total: queue.length,
    score: 0, combo: 0, maxCombo: 0,
    scoreShown: 0, scorePulse: 0, scoreFlash: 0,   // animated score readout
    shake: 0,                                       // screen-shake impulse
    bolts: [],                                      // lightning at high streaks
    milestone: null,                                // {text, life} streak callout
    res: { perfect: 0, great: 0, good: 0, miss: 0, early: 0, late: 0, offSum: 0, offCount: 0 },
    particles: [], floaters: [],
    flashSq: [],        // {x,y,color,t} brief square highlights
    // dir: facing (-1 looks left, the render's natural way; +1 mirrors her right).
    // dizzy: frames of whiplash spin. prevDx: last move's direction, for whiplash.
    princess: { x: 0, y: 7, px: 0, py: 0, tx: 0, ty: 0, dir: -1, dizzy: 0, prevDx: 0 },
    lastHitTime: 0,
    running: false, finished: false,
  };
  const pp = boardCenter(0, 7);
  G.princess.px = pp.x; G.princess.py = pp.y;
}

function boardCenter(x, y) {
  return { x: BX + x * TILE + TILE / 2, y: BY + y * TILE + TILE / 2 };
}

function startRun() {
  G.startTime = nowSec() + 0.35;     // small lead-in
  G.running = true;
  G.finished = false;
}

// ---- Scheduling ----
function beatTime(n) { return G.startTime + n * G.spb; }

function update() {
  if (!G || !G.running) return;
  const now = nowSec();

  // Schedule metronome beeps a touch ahead of real time
  while (beatTime(G.beepIdx) < now + 0.12) {
    const n = G.beepIdx;
    const isCall = n >= G.countIn && ((n - G.countIn) % G.bpc === 0) && (G.qPtr < G.queue.length || G.calls.some(c => c.beat === n));
    if (beatTime(n) >= now - 0.05) beep(beatTime(n), isCall);
    G.beepIdx++;
  }

  // Spawn upcoming calls within the approach window
  while (G.qPtr < G.queue.length && beatTime(G.callBeat) < now + APPROACH) {
    const def = G.queue[G.qPtr];
    G.calls.push({
      san: def.san, x: def.x, y: def.y,
      hitTime: beatTime(G.callBeat), beat: G.callBeat,
      status: 'pending', fade: 1,
    });
    G.qPtr++;
    G.callBeat += G.bpc;
  }

  // Auto-miss calls whose window has closed
  G.calls.forEach(c => {
    if (c.status === 'pending' && now > c.hitTime + G.goodW) {
      c.status = 'missed';
      registerResult('miss', c);
      flashSquare(c.x, c.y, COLORS.bad);
      floater('MISS', c, COLORS.bad);
      sfx('miss');
    }
  });

  // Missed pills slide down the tail, then tumble off the cliff (gravity + spin).
  G.calls.forEach(c => {
    if (c.status !== 'missed') return;
    if (!c.falling) {
      const x = HITX + (c.hitTime - now) * PXPS;
      if (x <= CLIFF_X) {
        c.falling = true;
        c.fx = CLIFF_X; c.fy = TRACK_Y;
        c.fvx = -1.3 - Math.random(); c.fvy = -2.4 - Math.random();   // a little hop, then drop
        c.spin = 0; c.spinV = (Math.random() - 0.5) * 0.5;
      }
    } else {
      c.fvy += 0.5; c.fx += c.fvx; c.fy += c.fvy; c.spin += c.spinV;
    }
  });

  // Resolve finished calls: a hit pill detonates at the gate and vanishes fast;
  // a missed pill is dropped once it has fallen off the bottom of the cliff.
  G.calls = G.calls.filter(c => {
    if (c.status === 'hit') { c.fade -= 0.16; return c.fade > 0; }
    if (c.status === 'missed') return !c.falling || c.fy < H + 60;
    return true; // pending
  });

  // Princess glide
  const pr = G.princess;
  const tgt = boardCenter(pr.tx, pr.ty);
  pr.px += (tgt.x - pr.px) * 0.35;
  pr.py += (tgt.y - pr.py) * 0.35;
  if (pr.dizzy > 0) pr.dizzy--;
  // Look ahead: she turns to face the square of the next call still in flight.
  let peek = null;
  G.calls.forEach(c => { if (c.status === 'pending' && (!peek || c.hitTime < peek.hitTime)) peek = c; });
  if (peek && !pr.dizzy) { if (peek.x > pr.tx) pr.dir = 1; else if (peek.x < pr.tx) pr.dir = -1; }

  // Particles
  G.particles = G.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 1; return p.life > 0;
  });
  // Floaters
  G.floaters = G.floaters.filter(f => { f.y -= 0.7; f.life -= 1; return f.life > 0; });
  // Square flashes
  G.flashSq = G.flashSq.filter(s => { s.t -= 1; return s.t > 0; });

  // Animated score readout + streak FX
  G.scoreShown += (G.score - G.scoreShown) * 0.25;
  if (Math.abs(G.score - G.scoreShown) < 0.5) G.scoreShown = G.score;
  G.scorePulse *= 0.88;
  G.scoreFlash *= 0.9;
  G.shake *= 0.86;
  if (G.milestone) { G.milestone.life--; if (G.milestone.life <= 0) G.milestone = null; }
  if (G.combo >= 15) { if (Math.random() < 0.45) spawnBolt(); if (Math.random() < 0.3) spawnBolt(); }
  else if (G.combo >= 10 && Math.random() < 0.1) spawnBolt();
  G.bolts = G.bolts.filter(b => { b.life--; return b.life > 0; });

  // Finish check
  if (G.qPtr >= G.queue.length && !G.calls.some(c => c.status === 'pending')
      && now > G.lastHitTime + G.goodW + 0.15 && !G.finished) {
    finish();
  }
}

const MILESTONES = { 3: 'STREAK ×3 ⚡', 5: 'HEATING UP ×5', 10: 'ON FIRE! ×10 🔥', 15: '⚡⚡ OVERLOAD ×15 ⚡⚡', 20: 'UNREAL ×20', 30: 'GODLIKE ×30' };
function checkMilestone(c) {
  if (MILESTONES[c]) {
    G.milestone = { text: MILESTONES[c], life: 64 };
    G.shake = Math.min(12, G.shake + 5);
  }
}

// `base` is the timing-scaled point value (perfect = full, early/late = less);
// returns the actual points added after the combo multiplier, for the floater.
function registerResult(kind, call, base) {
  let gained = 0;
  if (kind !== 'miss') {
    G.res[kind] = (G.res[kind] || 0) + 1;   // perfect | great | good
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    const mult = 1 + Math.min(G.combo, 20) * 0.05;
    gained = Math.round(base * mult);
    G.score += gained;
    G.scorePulse = 1;
    if (G.combo >= 3) G.shake = Math.min(G.combo >= 15 ? 19 : 11, 2 + G.combo * 0.5);
    checkMilestone(G.combo);
  } else {
    G.res.miss++;
    G.combo = 0;
  }
  G.lastHitTime = Math.max(G.lastHitTime, nowSec());
  return gained;
}

// ---- Input handling ----
function resolveAt(sqx, sqy) {
  if (!G || !G.running) return;
  const now = nowSec();
  // Nearest pending call within the good window
  let best = null, bestDt = Infinity;
  G.calls.forEach(c => {
    if (c.status !== 'pending') return;
    const dt = Math.abs(c.hitTime - now);
    if (dt <= G.goodW && dt < bestDt) { best = c; bestDt = dt; }
  });
  if (!best) return; // nothing to hit right now — no penalty

  if (best.x === sqx && best.y === sqy) {
    // Four-band, timing-driven scoring. Dead-on the gate = Perfect; the rest of
    // the window splits into Great / Good / Early·Late, each worth steadily less.
    const dtSigned = now - best.hitTime;                          // + = late, − = early
    const dir = dtSigned < 0 ? 'EARLY' : 'LATE';
    let kind, base, label, color;
    if (bestDt <= G.perfectW) {
      kind = 'perfect'; base = 100; label = 'PERFECT!'; color = COLORS.good;
    } else {
      const f = (bestDt - G.perfectW) / (G.goodW - G.perfectW);   // 0 (snug) → 1 (edge)
      if (f <= GREAT_RATIO)      { kind = 'great'; base = Math.round(82 - f * 30); label = 'GREAT · ' + dir; color = '#9bffd0'; }
      else if (f <= GOOD_RATIO)  { kind = 'good';  base = Math.round(58 - f * 25); label = 'GOOD · ' + dir;  color = COLORS.gold; }
      else                       { kind = 'good';  base = Math.round(34 - f * 12); label = dir;              color = '#ffb03a'; }
      // Early/late tally + running timing offset, for the end-of-run report.
      if (dtSigned < 0) G.res.early++; else G.res.late++;
    }
    G.res.offSum += dtSigned; G.res.offCount++;
    best.status = 'hit';
    const gained = registerResult(kind, best, base);
    movePrincess(sqx, sqy);
    popParticles(sqx, sqy, color);
    gateExplode(HITX + (best.hitTime - now) * PXPS, color, kind === 'perfect'); // burst on the track
    flashSquare(sqx, sqy, kind === 'perfect' ? 'rgba(107,255,184,0.5)' : 'rgba(245,197,24,0.45)');
    floater(label + ' +' + gained, best, color);
    sfx(kind === 'perfect' || kind === 'great' ? 'perfect' : 'good');
  } else {
    // Wrong square — miss, lose half-points, and reveal the correct one
    best.status = 'missed';
    registerResult('miss', best);
    const penalty = 50; // half of a base hit (100)
    G.score = Math.max(0, G.score - penalty);
    G.scorePulse = 1; G.scoreFlash = 1;
    flashSquare(best.x, best.y, COLORS.bad);
    flashSquare(sqx, sqy, 'rgba(255,107,107,0.3)');
    floater('WRONG → ' + best.san + '  −' + penalty, best, COLORS.bad);
    sfx('miss');
  }
}

function movePrincess(x, y) {
  const pr = G.princess;
  const dx = x - pr.tx;
  if (dx !== 0) {
    // Whiplash: a hard reverse across a big distance leaves her dizzy.
    if (pr.prevDx && Math.sign(dx) !== Math.sign(pr.prevDx) && (Math.abs(dx) + Math.abs(pr.prevDx)) >= 9) {
      pr.dizzy = Math.max(pr.dizzy, 90);
      G.shake = Math.min(18, G.shake + 7);
      floater('😵 whoa!', { x: x, y: y }, '#ffd166');
    }
    pr.prevDx = dx;
    pr.dir = dx > 0 ? 1 : -1;   // face the way she just moved
  }
  pr.tx = x; pr.ty = y;
}
function flashSquare(x, y, color) { G.flashSq.push({ x, y, color, t: 22 }); }
function floater(text, call, color) {
  const c = boardCenter(call.x, call.y);
  G.floaters.push({ text, x: c.x, y: c.y - 6, life: 46, color });
}
function popParticles(x, y, color) {
  const c = boardCenter(x, y);
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
    const s = 1.5 + Math.random() * 2.5;
    G.particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 24 + Math.random() * 12, color });
  }
}
// A burst on the rhythm track where a correctly-clicked call is detonated.
function gateExplode(px, color, big) {
  const n = big ? 22 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (big ? 2.5 : 1.8) + Math.random() * (big ? 4 : 3);
    G.particles.push({ x: px, y: TRACK_Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 16, color });
  }
}

function canvasToSquare(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const mx = (clientX - r.left) * (W / r.width);
  const my = (clientY - r.top) * (H / r.height);
  const col = Math.floor((mx - BX) / TILE);
  const row = Math.floor((my - BY) / TILE);
  if (col < 0 || col > 7 || row < 0 || row > 7) return null;
  return { x: col, y: row };
}

canvas.addEventListener('pointerdown', e => {
  const sq = canvasToSquare(e.clientX, e.clientY);
  if (sq) { e.preventDefault(); resolveAt(sq.x, sq.y); }
});

// ---- Rendering ----
function render() {
  ctx.clearRect(0, 0, W, H);
  if (!G) return;

  ctx.save();
  if (G.shake > 0.25) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);

  drawTrack();
  drawBoard();
  drawPrincess();
  drawParticles();
  drawFloaters();
  drawBolts();
  drawHUD();

  ctx.restore();
  drawOverload();
}

// Streak >=15: a pulsing electric frame + occasional strobe around the arena
function drawOverload() {
  if (!G || G.combo < 15) return;
  const now = nowSec();
  const hue = Math.floor((now * 620) % 360);
  const p = 0.16 + 0.12 * Math.abs(Math.sin(now * 9));
  ctx.save();
  ctx.globalAlpha = p;
  ctx.fillStyle = 'hsl(' + hue + ',100%,62%)';
  ctx.fillRect(0, 0, W, 7); ctx.fillRect(0, H - 7, W, 7);
  ctx.fillRect(0, 0, 7, H); ctx.fillRect(W - 7, 0, 7, H);
  ctx.restore();
  if (Math.random() < 0.05) {
    ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

function spawnBolt() {
  if (!G) return;
  const x0 = HITX + 10 + Math.random() * (W - HITX - 30);
  const segs = 6 + Math.floor(Math.random() * 4);
  const endY = TRACK_Y + 26 + Math.random() * 34;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const yy = 8 + (endY - 8) * (i / segs);
    pts.push({ x: x0 + (Math.random() - 0.5) * 24, y: yy });
  }
  G.bolts.push({ pts, life: 7 + Math.floor(Math.random() * 5), max: 11 });
}

function drawBolts() {
  if (!G || !G.bolts.length) return;
  ctx.save();
  ctx.shadowColor = 'rgba(120,180,255,0.9)';
  ctx.shadowBlur = 12;
  G.bolts.forEach(b => {
    ctx.globalAlpha = Math.min(1, b.life / b.max);
    ctx.strokeStyle = 'rgba(170,220,255,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    b.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  });
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBoard() {
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? COLORS.light : COLORS.dark;
      ctx.fillRect(BX + col * TILE, BY + row * TILE, TILE, TILE);
    }
  }
  // Square flashes
  G.flashSq.forEach(s => {
    ctx.fillStyle = s.color;
    ctx.fillRect(BX + s.x * TILE, BY + s.y * TILE, TILE, TILE);
  });
  // Grid lines + border
  ctx.strokeStyle = 'rgba(' + TH.rgb + ',0.10)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 8; i++) {
    ctx.beginPath(); ctx.moveTo(BX + i * TILE, BY); ctx.lineTo(BX + i * TILE, BY + BOARD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX, BY + i * TILE); ctx.lineTo(BX + BOARD, BY + i * TILE); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(' + TH.rgb + ',0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(BX, BY, BOARD, BOARD);

  // File / rank labels (the player's reading aid) — bold + brighter to find squares fast
  ctx.fillStyle = 'rgba(' + TH.rgb + ',0.7)';
  ctx.font = 'bold 13px Courier New';
  ctx.textBaseline = 'alphabetic';
  const files = 'abcdefgh';
  for (let i = 0; i < 8; i++) {
    ctx.textAlign = 'left';
    ctx.fillText(files[i], BX + i * TILE + 3, BY + BOARD - 4);   // files along bottom
    ctx.fillText(8 - i, BX + 3, BY + i * TILE + 15);             // ranks down the left
  }
}

function drawTrack() {
  const now = nowSec();
  const combo = G ? G.combo : 0;
  const heat = combo >= 15 ? 3 : combo >= 10 ? 2 : combo >= 3 ? 1 : 0;  // 0 calm·1 warm·2 electric·3 OVERLOAD

  // Track baseline — bold rhythm bar; vibrates and heats up with your streak
  let by = TRACK_Y, lw = 8, col = 'rgba(' + TH.rgb + ',0.9)', glow = 0;
  if (heat === 3) {
    // OVERLOAD: a thrashing, racing-rainbow electric bar
    by += (Math.random() - 0.5) * 9;
    lw = 14 + Math.sin(now * 42) * 2.5;
    glow = 30;
    col = 'hsl(' + Math.floor((now * 620) % 360) + ', 100%, 66%)';
  } else if (heat >= 1) {
    by += (Math.random() - 0.5) * (heat === 2 ? 5 : 2.4);
    lw = heat === 2 ? 12 : 10;
    glow = heat === 2 ? 20 : 11;
    col = heat === 2 ? 'rgba(130,205,255,0.97)' : 'rgba(255,168,58,0.96)';
  }
  // Tail — the dim run-off ramp left of the gate, ending at a broken cliff edge
  // where missed calls tumble into the void.
  ctx.save();
  ctx.strokeStyle = 'rgba(255,107,107,0.32)';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.setLineDash([5, 7]);
  ctx.beginPath(); ctx.moveTo(CLIFF_X, TRACK_Y); ctx.lineTo(HITX, TRACK_Y); ctx.stroke();
  ctx.restore();
  // The cliff: a jagged drop-off at CLIFF_X
  ctx.save();
  ctx.strokeStyle = 'rgba(255,107,107,0.7)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(CLIFF_X, TRACK_Y - 9);
  ctx.lineTo(CLIFF_X, TRACK_Y + 4);
  ctx.lineTo(CLIFF_X - 5, TRACK_Y + 10);
  ctx.lineTo(CLIFF_X + 2, TRACK_Y + 16);
  ctx.lineTo(CLIFF_X - 4, TRACK_Y + 23);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(HITX, by); ctx.lineTo(W - 8, by); ctx.stroke();
  ctx.restore();
  ctx.lineCap = 'butt';

  // Beat pulse at the gate
  const sinceBeat = G.running ? ((now - G.startTime) % G.spb) / G.spb : 0;
  const pulse = G.running ? (1 - Math.min(sinceBeat * 2, 1)) : 0;
  ctx.strokeStyle = 'rgba(' + TH.rgb + ',' + (0.35 + 0.5 * pulse) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(HITX, TRACK_Y, 17 + pulse * 5, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(' + TH.rgb + ',0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(HITX, TRACK_Y - 26); ctx.lineTo(HITX, TRACK_Y + 26); ctx.stroke();

  // Approach ring — shrinks onto the gate as the imminent call lands, turning
  // green the moment it's actually hittable. The clearest "click NOW" cue.
  if (G.running) {
    let nextC = null;
    G.calls.forEach(c => { if (c.status === 'pending' && (!nextC || c.hitTime < nextC.hitTime)) nextC = c; });
    if (nextC) {
      const delta = nextC.hitTime - now;
      const LEAD = 1.0, GATE_R = 16, MAX_EXTRA = 22;
      const ringR = GATE_R + Math.min(Math.max(delta, 0), LEAD) / LEAD * MAX_EXTRA;
      const within = Math.abs(delta) <= G.goodW;
      ctx.strokeStyle = within ? 'rgba(107,255,184,0.95)' : 'rgba(' + TH.rgb + ',0.55)';
      ctx.lineWidth = within ? 3 : 2;
      ctx.beginPath(); ctx.arc(HITX, TRACK_Y, ringR, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Incoming calls — drawn as rounded "pills" sized to the notation text
  G.calls.forEach(c => {
    const falling = c.status === 'missed' && c.falling;
    const x = falling ? c.fx : HITX + (c.hitTime - now) * PXPS;
    const y = falling ? c.fy : TRACK_Y;
    if (!falling && (x > W + 20 || x < -40)) return;
    const dt = Math.abs(c.hitTime - now);
    const active = c.status === 'pending' && dt <= G.goodW;

    const fontSize = active ? 28 : 22;
    ctx.font = 'bold ' + fontSize + 'px Courier New';
    const textW = ctx.measureText(c.san).width;
    const padX = active ? 12 : 9;
    const w = textW + padX * 2;
    const h = fontSize + 12;

    // A hit pill pops larger as it detonates; a missed pill stays solid as it
    // slides to the cliff, then fades as it tumbles into the void below.
    let scale = 1, alpha = 1;
    if (c.status === 'hit') { scale = 1 + (1 - c.fade) * 0.6; alpha = c.fade; }
    else if (falling) alpha = Math.max(0, 1 - (c.fy - TRACK_Y) / (H - TRACK_Y));

    let fill, stroke, textColor;
    if (c.status === 'hit') { fill = 'rgba(107,255,184,'+(0.75*alpha)+')'; stroke = 'rgba(107,255,184,'+alpha+')'; textColor = '#0c3d28'; }
    else if (c.status === 'missed') { fill = 'rgba(255,107,107,'+(0.66*alpha)+')'; stroke = 'rgba(255,107,107,'+alpha+')'; textColor = 'rgba(255,255,255,'+alpha+')'; }
    else if (active) { fill = 'rgba(' + TH.rgb + ',0.95)'; stroke = '#fff'; textColor = '#1a0f3d'; }
    else { fill = COLORS.dark; stroke = '#7a5fb0'; textColor = COLORS.text; }

    ctx.save();
    ctx.translate(x, y);
    if (falling) ctx.rotate(c.spin);
    pill(0, 0, w * scale, h * scale, h * scale / 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = active ? 2.5 : 1.5; ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.font = 'bold ' + fontSize + 'px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.san, 0, 1);
    ctx.restore();
  });
}

// Rounded-rectangle "pill" centered at (cx, cy)
function pill(cx, cy, w, h, r) {
  const x = cx - w / 2, y = cy - h / 2;
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Princess's 3D Blender render (from her character page), shown as her token
const princessImg = new Image();
let princessImgReady = false;
princessImg.onload = function () { princessImgReady = true; };
princessImg.src = '/assets/images/Princess_Color_v01.jpg';

function drawPrincess() {
  const pr = G.princess;
  const cx = pr.px, cy = pr.py;
  const t = Date.now() / 600;
  const bob = Math.sin(t) * 1.5;
  const r = 17;
  // When dizzy, she wobbles; otherwise she sits upright.
  const tilt = pr.dizzy > 0 ? Math.sin(Date.now() / 70) * 0.35 * (pr.dizzy / 90) : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 15, 13, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.rotate(tilt);
  // The 3D render faces left; mirror horizontally so she can look to her right.
  if (pr.dir > 0) ctx.scale(-1, 1);

  if (princessImgReady) {
    // Circular avatar token of the 3D render (top-centred square crop)
    const iw = princessImg.naturalWidth, ih = princessImg.naturalHeight;
    const s = Math.min(iw, ih);
    const sx = (iw - s) / 2, sy = 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
    ctx.drawImage(princessImg, sx, sy, s, s, -r, -r, r * 2, r * 2);
    ctx.restore();
    ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.fillStyle = '#f0e6ff'; drawHex(0, 0, 15); ctx.fill();
    ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 1.5; drawHex(0, 0, 15); ctx.stroke();
    ctx.fillStyle = COLORS.gold;
    ctx.font = 'bold 12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('♞', 0, 0);
  }
  ctx.restore();

  // Dizzy stars orbiting her head after a whiplash swing
  if (pr.dizzy > 0) {
    const a = Date.now() / 110;
    ctx.fillStyle = '#ffd166';
    ctx.font = '12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 3; i++) {
      const ang = a + i * (Math.PI * 2 / 3);
      ctx.globalAlpha = Math.min(1, pr.dizzy / 90);
      ctx.fillText('✦', cx + Math.cos(ang) * 15, cy + bob - r - 2 + Math.sin(ang) * 5);
    }
    ctx.globalAlpha = 1;
  }
}

function drawHex(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 2 + i * Math.PI / 3;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawParticles() {
  G.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  });
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  G.floaters.forEach(f => {
    ctx.globalAlpha = Math.max(0, f.life / 46);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Score (top-left) — big, and pops/flashes when it changes
  const scoreStr = String(Math.max(0, Math.round(G.scoreShown))).padStart(5, '0');
  ctx.save();
  ctx.translate(12, 10);
  ctx.scale(1 + G.scorePulse * 0.45, 1 + G.scorePulse * 0.45);
  ctx.fillStyle = G.scoreFlash > 0.06 ? COLORS.bad : COLORS.gold;
  ctx.font = 'bold 24px Courier New';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  if (G.scorePulse > 0.08) { ctx.shadowColor = COLORS.gold; ctx.shadowBlur = 14 * G.scorePulse; }
  ctx.fillText(scoreStr, 0, 0);
  ctx.restore();

  // Live score multiplier badge (the payoff of your streak)
  if (G.combo >= 2) {
    const mult = 1 + Math.min(G.combo, 20) * 0.05;
    ctx.fillStyle = G.combo >= 10 ? 'rgba(150,210,255,0.97)' : COLORS.good;
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('×' + mult.toFixed(2), 13, 40);
  }

  // Progress (top-right)
  const done = G.res.perfect + G.res.great + G.res.good + G.res.miss;
  ctx.fillStyle = COLORS.muted;
  ctx.font = '11px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(done + ' / ' + G.total, W - 10, 10);

  // Combo (center, big when high)
  if (G.combo > 1) {
    ctx.fillStyle = G.combo >= 10 ? COLORS.good : COLORS.text;
    ctx.font = 'bold ' + (14 + Math.min(G.combo, 20)) + 'px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(G.combo + '×', W / 2, 6);
  }

  // Streak milestone callout (between track and board)
  if (G.milestone) {
    const a = Math.min(1, G.milestone.life / 64);
    const rise = (1 - a) * 10;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = G.combo >= 10 ? 'rgba(150,210,255,1)' : COLORS.gold;
    ctx.font = 'bold 26px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 16;
    ctx.fillText(G.milestone.text, W / 2, BY - 16 - rise);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Count-in banner
  const now = nowSec();
  if (G.running && now < G.startTime + G.countIn * G.spb) {
    const beatsLeft = Math.ceil((G.startTime + G.countIn * G.spb - now) / G.spb);
    ctx.fillStyle = 'rgba(' + TH.rgb + ',0.85)';
    ctx.font = 'bold 30px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(beatsLeft > 0 ? beatsLeft : 'GO', W / 2, BY + BOARD / 2);
  }
}

// ---- Main loop ----
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ---- Screens / flow ----
let selMode = 'coords', selDiff = 'medium';

function modeName(mode) { return mode === 'coords' ? 'Coordinates' : (OPENINGS[mode] ? OPENINGS[mode].label : 'Coordinates'); }
function updateTitleBest() {
  const best = loadBests()[selMode + '_' + selDiff];
  const el = document.getElementById('title-best');
  el.innerHTML = best
    ? 'Best (' + modeName(selMode) + ' · ' + DIFFS[selDiff].label + '): <b>' + best.rank + '</b> · ' + best.score
    : 'Best (' + modeName(selMode) + ' · ' + DIFFS[selDiff].label + '): <b>—</b>';
}

var modeRow = document.getElementById('mode-row');
if (modeRow) modeRow.addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  selMode = b.dataset.mode;
  document.querySelectorAll('#mode-row .pick').forEach(p => p.classList.toggle('sel', p === b));
  updateTitleBest();
});
document.getElementById('diff-row').addEventListener('click', e => {
  const b = e.target.closest('[data-diff]'); if (!b) return;
  selDiff = b.dataset.diff;
  document.querySelectorAll('#diff-row .pick').forEach(p => p.classList.toggle('sel', p === b));
  newGame(selMode, selDiff);   // re-theme the preview board behind the title to this tempo
  updateTitleBest();
});

document.getElementById('mute-toggle').addEventListener('click', () => {
  soundOn = !soundOn;
  if (masterGain) masterGain.gain.value = soundOn ? 0.9 : 0;
  document.getElementById('mute-toggle').textContent = soundOn ? '♪ sound: on' : '♪ sound: off';
});

function begin() {
  initAudio();
  if (actx.state === 'suspended') actx.resume();
  newGame(selMode, selDiff);
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('results-screen').classList.add('hidden');
  startRun();
}

document.getElementById('start-btn').addEventListener('click', begin);
document.getElementById('replay-btn').addEventListener('click', begin);
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('results-screen').classList.add('hidden');
  document.getElementById('title-screen').classList.remove('hidden');
  newGame(selMode, selDiff);   // reset the idle preview board to the selected tempo
});

function finish() {
  G.running = false;
  G.finished = true;
  const r = G.res;
  const total = G.total;
  // Quality-weighted accuracy: Perfect counts full, Great most, Good half.
  const accVal = total > 0 ? (r.perfect + r.great * 0.8 + r.good * 0.5) / total : 0;
  const acc = Math.round(accVal * 100);
  let rank, color;
  if (r.miss === 0 && accVal >= 0.97) { rank = 'S'; color = '#6bffb8'; }
  else if (accVal >= 0.88) { rank = 'A'; color = '#F5C518'; }
  else if (accVal >= 0.72) { rank = 'B'; color = '#c96bff'; }
  else if (accVal >= 0.52) { rank = 'C'; color = '#6bbfff'; }
  else { rank = 'D'; color = '#ff6b6b'; }

  const modeLabel = G.mode === 'coords' ? 'Coordinates'
    : OPENINGS[G.mode].label;
  document.getElementById('res-mode-label').textContent = modeLabel + ' · ' + DIFFS[G.diff].label;
  const badge = document.getElementById('res-rank');
  badge.textContent = rank; badge.style.color = color;
  document.getElementById('res-fc-wrap').style.display = (r.miss === 0) ? 'block' : 'none';
  document.getElementById('res-score').textContent = G.score;
  document.getElementById('res-acc').textContent = acc + '%';
  document.getElementById('res-combo').textContent = G.maxCombo + '×';
  document.getElementById('res-perfect').textContent = r.perfect;
  document.getElementById('res-great').textContent = r.great;
  document.getElementById('res-good').textContent = r.good;
  document.getElementById('res-miss').textContent = r.miss;

  // Early / late breakdown + average timing offset (ms, + = late).
  document.getElementById('res-early').textContent = r.early;
  document.getElementById('res-late').textContent = r.late;
  const avgMs = r.offCount ? Math.round(r.offSum / r.offCount * 1000) : 0;
  let timing;
  if (!r.offCount) timing = '—';
  else if (Math.abs(avgMs) <= 12) timing = 'dead-on (' + (avgMs >= 0 ? '+' : '') + avgMs + 'ms)';
  else if (avgMs > 0) timing = '+' + avgMs + 'ms · tend LATE';
  else timing = avgMs + 'ms · tend EARLY';
  document.getElementById('res-timing').textContent = timing;

  // Personal best (per mode + tempo)
  const bests = loadBests();
  const key = G.mode + '_' + G.diff;
  const prev = bests[key];
  const isBest = !prev || G.score > prev.score;
  if (isBest) { bests[key] = { score: G.score, rank }; saveBests(bests); }
  const bestEl = document.getElementById('res-best');
  if (isBest) bestEl.innerHTML = '<b style="color:#6bffb8;">✨ NEW BEST! ✨</b>';
  else bestEl.innerHTML = 'Best: <b style="color:#F5C518;">' + prev.rank + '</b> · ' + prev.score;
  updateTitleBest();
  if (window.PJCC) PJCC.saveScore('notation-run', G.score, { credits: 1, data: { mode: G.mode, diff: G.diff, rank: rank } });
  // Perfect Sprint (rank S on the hardest tempo) unlocks Blindfold Puzzles.
  if (G.diff === 'hard' && rank === 'S') {
    try {
      if (localStorage.getItem('pjcc.blindfold.unlocked') !== '1') {
        localStorage.setItem('pjcc.blindfold.unlocked', '1');
        document.getElementById('res-best').innerHTML += '<br><b style="color:#6bffb8;">🔓 Blindfold Puzzles unlocked!</b>';
      }
    } catch (e) {}
  }

  document.getElementById('results-screen').classList.remove('hidden');
}

// Boot
newGame(selMode, selDiff);   // so the board renders behind the title screen
updateTitleBest();
loop();
</script>
</body>
</html>
