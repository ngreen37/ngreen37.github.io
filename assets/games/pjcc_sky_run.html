<!DOCTYPE html>

<title>PJCC: Sky Run v2.0</title>
<!-- THE TOWN SKY (2026-08-03, cohesion #6): the clock first, then the wash it drives.
     ORDER IS LOAD-BEARING - pjcc-game-sky.js finds no clock if these swap, and does
     nothing at all without saying so. tests/townsky.check.js checks both, in order. -->
<script src="/assets/js/pjcc-time.js"></script>
<script src="/assets/js/pjcc-game-sky.js"></script>
<script src="/assets/js/pjcc-config.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05060f; overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #stage { position: relative; width: 100%; max-width: 460px; }
  #canvas { display: block; width: 100%; height: auto; border: 3px solid #8fb8ff; border-radius: 14px;
    background: #0a0f24; box-shadow: 0 0 44px rgba(143,184,255,0.28); }

  .float-btn { position: absolute; z-index: 6; font-family: 'Trebuchet MS', sans-serif; font-weight: bold;
    border: none; border-radius: 999px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.4);
    transition: transform 0.07s, filter 0.12s; user-select: none; }
  .float-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  #menu-btn { top: 10px; right: 10px; background: #1a2348; color: #bcd0ff; padding: 5px 12px; font-size: 11px; border: 1px solid #3a4f86; }
  #summon-btn { bottom: 12px; right: 12px; background: linear-gradient(180deg,#ffe27a,#e0a82a); color: #2a1a06;
    padding: 12px 16px; font-size: 14px; min-width: 96px; text-align: center; }
  #summon-btn.empty { filter: grayscale(0.7) brightness(0.7); }
  #summon-btn small { display: block; font-size: 9px; letter-spacing: 1px; opacity: 0.8; }
  #focus-btn { bottom: 12px; left: 12px; background: linear-gradient(180deg,#9fe8ff,#3a7fb0); color: #04121a;
    padding: 12px 16px; font-size: 13px; min-width: 84px; text-align: center; touch-action: none; }
  #focus-btn small { display: block; font-size: 9px; letter-spacing: 1px; opacity: 0.8; }
  #focus-btn.on { filter: brightness(1.2); box-shadow: 0 0 16px rgba(159,232,255,0.85); }
  .float-btn.hidden { display: none; }

  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 26px; text-align: center; border-radius: 14px;
    background: radial-gradient(circle at 50% 22%, #16224e 0%, #05060f 82%); }
  .overlay.hidden { display: none; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; color: #8fb8ff; text-transform: uppercase; margin-bottom: 10px; }
  .big-title { font-size: 34px; font-weight: 900; color: #ffe27a; letter-spacing: 2px;
    text-shadow: 0 3px 0 #6a4a00, 0 0 26px rgba(255,210,90,0.5); margin-bottom: 4px; }
  .blurb { font-size: 12.5px; color: #cfe0ff; line-height: 1.7; max-width: 360px; margin-bottom: 16px; }
  .blurb b { color: #ffe27a; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { font-family: 'Trebuchet MS', sans-serif; font-weight: bold; cursor: pointer; border: none; border-radius: 999px;
    padding: 12px 30px; font-size: 15px; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  .btn-gold { background: #ffe27a; color: #2a1a06; } .btn-gold:hover { filter: brightness(1.05); }
  .btn-ghost { background: #1a2348; color: #bcd0ff; box-shadow: 0 4px 0 #0a1024; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; max-width: 320px; margin: 4px auto 14px;
    font-size: 11.5px; color: #cfe0ff; text-align: left; }
  .legend .g { font-size: 15px; text-align: center; }
  .foot { margin-top: 14px; font-size: 10.5px; color: #6a7aa8; line-height: 1.7; } .foot b { color: #bcd0ff; }
  /* Home-screen: cool + minimal — no instruction dump (controls live below the game). */
  .menu-tag { font-size: 14.5px; color: #cfe0ff; letter-spacing: 0.5px; margin-bottom: 24px; }
  .menu-tag b { color: #ffe27a; }
  .menu-best { margin-top: 18px; font-size: 12px; letter-spacing: 1px; color: #8fb8ff; }
  .menu-best b { color: #bcd0ff; }
</style>

<body>
<div id="stage">
  <canvas id="canvas" width="440" height="640"></canvas>
  <button class="float-btn hidden" id="menu-btn">☰ Menu</button>
  <button class="float-btn hidden" id="focus-btn">◎ FOCUS<small>hold</small></button>
  <button class="float-btn hidden" id="summon-btn">♚ SUMMON<small>0 pawns</small></button>

  <!-- MENU (home screen — cool + minimal; controls live below the game) -->
  <div class="overlay" id="menu">
    <div class="eyebrow">Princess takes flight</div>
    <div class="big-title">SKY RUN</div>
    <div class="menu-tag">The long flight to <b>Chess City</b>.</div>
    <div class="row"><button class="btn btn-gold" id="play-btn">▶ TAKE FLIGHT</button><button class="btn btn-ghost" id="daily-btn">📅 DAILY</button><button class="btn btn-ghost" id="endless-btn">🌊 ENDLESS</button></div>
    <div class="menu-best"><b id="best-line">best: —</b></div>
  </div>

  <!-- GAME OVER / VICTORY -->
  <div class="overlay hidden" id="result">
    <div class="eyebrow" id="res-eye">Shot down</div>
    <div class="big-title" id="res-title" style="font-size:26px;">SKY RUN</div>
    <div class="blurb" id="res-msg"></div>
    <div class="row">
      <button class="btn btn-gold" id="retry-btn">FLY AGAIN</button>
      <button class="btn btn-ghost" id="card-btn">📷 CARD</button>
      <button class="btn btn-ghost" id="menu-btn2">MENU</button>
    </div>
  </div>
</div>

<script>
"use strict";
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 440, H = 640;

// ---------- regions (town to town, ending at Chess City + the secret CEO's Office) ----------
const REGIONS = [
  { id:1, name:'Checker Town',     loc:'Where it begins',   sky:['#2a1a5e','#e0995a'], glow:'#ffd9a0', pool:['pawn','pawn','bishop'] },
  { id:2, name:'The Open Sea',     loc:'Across the water',  sky:['#0a2540','#5bb0e0'], glow:'#bfe6ff', pool:['pawn','bishop','bishop','knight'] },
  { id:3, name:'Shogi Isle',       loc:'Foreign shores',    sky:['#3a1530','#f0905a'], glow:'#ffc6a0', pool:['bishop','knight','knight','rook'] },
  { id:4, name:'Chess City',       loc:'The gleaming gate', sky:['#0a0a22','#2a2050'], glow:'#ffe27a', pool:['knight','rook','rook','queen'] },
  { id:5, name:"The CEO's Office", loc:'★ Restricted ★',    sky:['#100018','#3a0a18'], glow:'#ff6a8a', pool:['knight','rook','queen','queen','pawn'], secret:true }
];

// ---------- enemy & token archetypes ----------
const ENEMY = {
  pawn:   { glyph:'♟', hp:2,  r:13, spd:78,  pts:10, fill:'#b9a8e6', pat:'straight' },
  bishop: { glyph:'♝', hp:3,  r:14, spd:70,  pts:15, fill:'#c79bff', pat:'zigzag' },
  knight: { glyph:'♞', hp:4,  r:15, spd:64,  pts:20, fill:'#8fe3ff', pat:'hop' },
  rook:   { glyph:'♜', hp:9,  r:17, spd:42,  pts:30, fill:'#ffb066', pat:'tank' },
  queen:  { glyph:'♛', hp:16, r:19, spd:46,  pts:80, fill:'#ff8fd0', pat:'weave', shoots:true }
};
const POWERS = ['bishop','knight','queen'];
const POWER_GLYPH = { bishop:'♗', knight:'♘', queen:'♕' };
const POWER_COL   = { bishop:'#c79bff', knight:'#8fe3ff', queen:'#ff8fd0' };
const POWER_NAME  = { bishop:'♗ X-BEAMS!', knight:'♘ ESCORTS!', queen:'♕ SUPER-SHOT!' };
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
const PWR_DUR = { bishop:12, knight:14, queen:10 }, PWR_CAP = 22;

// ---------- Princess's rise (in-run promotion: pawn → knight → bishop → rook → queen) ----------
// She clears a region, she rises a rank, and her default fire grows with her. She reaches the
// gleaming gate as the Queen. (A quiet nod to the show: she assumes the next square is already hers.)
const RANK_NAME    = ['Pawn','Knight','Bishop','Rook','Queen'];
const RANK_GLYPH   = ['♙','♘','♗','♖','♕'];
const RANK_COL     = ['#cfe0ff','#8fe3ff','#c79bff','#ffb066','#ff8fd0'];
const RANK_AURA    = ['#6a7aa8','#3a7fb0','#7a4fd0','#c07a2a','#ff5bb0'];
const RANK_FIRE_CD = [0.185, 0.165, 0.150, 0.150, 0.135];

const KILLS_PER_PAWN = 9, MAX_PAWNS = 8, START_HEARTS = 5;
const BEST_KEY = 'pjcc.skyrun.best.v1', BEST_KEY_D = 'pjcc.skyrun.dailybest.v1', BEST_KEY_E = 'pjcc.skyrun.endlessbest.v1';
function loadBest(){ try { return parseInt(localStorage.getItem(BEST_KEY)) || 0; } catch(e){ return 0; } }
function saveBest(v){ try { localStorage.setItem(BEST_KEY, String(v)); } catch(e){} }
function loadBestD(){ try { var o=JSON.parse(localStorage.getItem(BEST_KEY_D)||'{}'); return o.d===dayStr()?(o.v||0):0; } catch(e){ return 0; } }
function saveBestD(v){ try { localStorage.setItem(BEST_KEY_D, JSON.stringify({ d:dayStr(), v:v })); } catch(e){} }
function loadBestE(){ try { return parseInt(localStorage.getItem(BEST_KEY_E)) || 0; } catch(e){ return 0; } }
function saveBestE(v){ try { localStorage.setItem(BEST_KEY_E, String(v)); } catch(e){} }

// ---------- audio ----------
let actx=null, master=null, sndOn=true;
function initAudio(){ if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=sndOn?0.6:0; master.connect(actx.destination); }
function tone(f,t0,dur,type,vol){ if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.connect(g);g.connect(master);o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.start(t0);o.stop(t0+dur+0.02);}
let lastShot=0;
function sfx(k){ if(!actx) return; const t=actx.currentTime;
  if(k==='shoot'){ if(t-lastShot<0.04) return; lastShot=t; tone(880,t,0.05,'square',0.05); }
  else if(k==='pop'){ tone(420,t,0.07,'triangle',0.14); tone(620,t+0.02,0.06,'triangle',0.1); }
  else if(k==='power'){ [523,784,1047].forEach((f,i)=>tone(f,t+i*0.05,0.16,'triangle',0.2)); }
  else if(k==='pawn'){ tone(300,t,0.1,'square',0.16); tone(180,t+0.04,0.12,'sawtooth',0.14); }
  else if(k==='boom'){ tone(150,t,0.3,'sawtooth',0.24); tone(90,t+0.05,0.34,'sawtooth',0.2); }
  else if(k==='hurt'){ tone(200,t,0.2,'sawtooth',0.22); tone(110,t+0.05,0.24,'sawtooth',0.18); }
  else if(k==='charge'){ tone(660,t,0.1,'triangle',0.18); tone(990,t+0.06,0.12,'triangle',0.16); }
  else if(k==='boss'){ [196,165,131].forEach((f,i)=>tone(f,t+i*0.12,0.4,'sawtooth',0.22)); }
  else if(k==='win'){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.09,0.28,'triangle',0.22)); }
  else if(k==='lose'){ [330,247,196,131].forEach((f,i)=>tone(f,t+i*0.14,0.34,'sawtooth',0.2)); } }

// ---------- helpers ----------
function rnd(a,b){ return a + Math.random()*(b-a); }
// ---- Daily mode: a seeded RNG drives the SPAWN DIRECTOR so the enemy script is
// identical for everyone on a given day. Cosmetic randomness keeps Math.random. ----
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let SRNG=null;
function srnd(){ return SRNG ? SRNG() : Math.random(); }
function srndR(a,b){ return a + srnd()*(b-a); }
function dayStr(){ var d=new Date(); return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }
function todaySeed(){ var s=''+(new Date()).getUTCFullYear()+dayStr(); var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }

// ---------- state ----------
let G = null;
const FIRE_CD = 0.16, BSPD = 560, PAWNSPD = 460, DIAG = 200;

function newGame(mode){
  mode = mode || 'normal';
  const daily = mode==='daily', endless = mode==='endless';
  SRNG = daily ? mulberry32(todaySeed()) : null;
  G = {
    mode: mode, daily: daily, endless: endless, loop: 1,
    time: 0, running: true, over: false,
    px: W/2, py: H-90, tx: W/2, ty: H-90, pr: 16,
    hearts: endless ? 1 : START_HEARTS, inv: 0, score: 0,
    best: daily ? loadBestD() : (endless ? loadBestE() : loadBest()),
    combo: 0, mult: 1, killAcc: 0, pawns: 0,
    pwr: { bishop:0, knight:0, queen:0 }, escorts: [],
    fireCd: 0, rank: 0, focus: false, promo: null,
    dog: { x: W/2-40, y: H-70, mode:'follow', target:null, carry:null, biteCd:0, fetchCd:1, bark:0, t:0 },
    region: 1, regionIdx: 0, waveIdx: 0, wavesInRegion: 5,
    toSpawn: [], boss: null, phase: 'play',  // play | interstitial | done
    interT: 0, nextRegion: 1,
    enemies: [], bullets: [], ebullets: [], ppawns: [], tokens: [], parts: [], floaters: [], rings: [],
    banner: '', bannerT: 0, shake: 0, flash: 0, pflash: 0, pflashCol: '#fff', bg: makeBg()
  };
  startRegion(1);
}
function curRegion(){ return REGIONS[G.region-1]; }

// ---------- background (parallax flight) ----------
function makeBg(){ const a=[]; for(let i=0;i<60;i++) a.push({ x:Math.random()*W, y:Math.random()*H, z:0.3+Math.random()*1.4, s:0.6+Math.random()*1.8 }); return a; }

// ---------- region / wave flow ----------
function startRegion(n){
  G.region = n; G.waveIdx = 0; G.wavesInRegion = 4 + n; G.boss = null; G.phase = 'play';
  G.enemies.length = 0; G.ebullets.length = 0;
  const r = curRegion();
  G.banner = (r.secret ? '★ ' : '') + r.name.toUpperCase(); G.bannerT = 2.2;
  sfx('boss');
  startWave();
}
function genWave(region, waveIdx){
  const pool = REGIONS[region-1].pool;
  const groups = 2 + Math.floor(waveIdx/2);
  const out = [];
  for (let g=0; g<groups; g++){
    const t = pool[(srnd()*pool.length)|0];
    const n = 3 + Math.floor((region + waveIdx)/2);
    const gap = Math.max(0.26, 0.62 - region*0.04 - waveIdx*0.02);
    out.push({ t, n, gap });
  }
  return out;
}
function startWave(){
  if (G.waveIdx >= G.wavesInRegion){ startBoss(); return; }
  const groups = genWave(G.region, G.waveIdx);
  let t = G.time + 0.5;
  G.toSpawn = [];
  groups.forEach(grp => { for (let i=0;i<grp.n;i++){ G.toSpawn.push({ type: grp.t, time: t }); t += grp.gap; } t += 0.7; });
  G.waveIdx++;
  G.banner = 'WAVE ' + G.waveIdx + ' / ' + G.wavesInRegion; G.bannerT = 1.5;
}
// Each region's King fights differently; the CEO fights in phases. Every boss
// periodically drops its guard — a telegraphed WEAK-POINT window that rewards focus fire.
const BOSS_KIND = ['aim','sweep','burst','royal','ceo'];
function startBoss(){
  if (G.boss) return;
  const r = curRegion();
  const hp = Math.round((200 + G.region*130) * (1+(G.loop-1)*0.5));
  G.boss = { x: W/2, y: -40, ty: 96, hp: hp, maxhp: hp, t: 0, fireCd: 1.4, addCd: 5, dir: 1, entering: true,
    kind: BOSS_KIND[(G.region-1) % BOSS_KIND.length], phase: 1, vuln: 0, vulnCd: 6,
    name: r.secret ? 'THE CEO' : r.name + ' King' };
  G.banner = '⚠ ' + G.boss.name.toUpperCase(); G.bannerT = 2.0; sfx('boss');
}

// ---------- spawning ----------
function spawnEnemy(type, x){
  const a = ENEMY[type];
  const ex = (x==null) ? srndR(a.r+8, W-a.r-8) : x;
  const sc = 1+(G.loop-1)*0.4, ssp = 1+(G.loop-1)*0.12, hp = Math.round(a.hp*sc);  // Endless loops escalate
  G.enemies.push({ type, glyph:a.glyph, fill:a.fill, r:a.r, hp:hp, maxhp:hp, pts:a.pts,
    x:ex, y:-a.r-srndR(0,40), vx:0, vy:a.spd*ssp, pat:a.pat, t:srndR(0,6), shoots:!!a.shoots, shootCd:srndR(1.2,2.4), seed:srndR(0,100) });
}

// ---------- firing ----------
function shoot(x,y,vx,vy,sup,opt){ opt=opt||{}; G.bullets.push({ x, y, vx, vy, r:(opt.r||(sup?7:4)), dmg:(sup?3:1)+(opt.dmg||0), pierce:(sup?2:0)+(opt.pierce||0), sup, bishop:!!opt.bishop, hit:null }); }
// Default fire by rank — each piece shoots a little like it moves.
function firePattern(){
  const px=G.px, py=G.py;
  switch (G.rank){
    case 0:  // Pawn — one honest shot forward
      shoot(px, py-18, 0, -BSPD); break;
    case 1:  // Knight — a quick forward pair
      shoot(px-6, py-16, 0, -BSPD); shoot(px+6, py-16, 0, -BSPD); break;
    case 2:  // Bishop — forward, plus the two diagonals
      shoot(px, py-18, 0, -BSPD);
      shoot(px-6, py-12, -DIAG, -BSPD*0.96, false, { bishop:true });
      shoot(px+6, py-12,  DIAG, -BSPD*0.96, false, { bishop:true }); break;
    case 3:  // Rook — a heavy piercing lance down the file + two flankers
      shoot(px, py-20, 0, -BSPD*1.05, false, { dmg:2, r:7, pierce:1 });
      shoot(px-9, py-10, 0, -BSPD); shoot(px+9, py-10, 0, -BSPD); break;
    default: // Queen — every line at once
      { const S=BSPD*0.92, D=S*0.71;
        [[0,-S],[0,S],[-S,0],[S,0],[-D,-D],[D,-D],[-D,D],[D,D]].forEach(d=>shoot(px,py-6,d[0],d[1],false,{r:6})); }
  }
}
function fire(){
  if (G.pwr.queen>0){
    // Queen power-up — the ultimate: all eight lines, piercing. Overrides rank.
    const S=BSPD*0.98, D=S*0.71;
    [[0,-S],[0,S],[-S,0],[S,0],[-D,-D],[D,-D],[-D,D],[D,D]].forEach(d=>shoot(G.px,G.py-6,d[0],d[1],true,{r:7}));
  } else if (G.focus){
    // Focus — trade the spread for one concentrated piercing beam; the higher she's risen, the harder it bites.
    const dmg = 2 + G.rank;
    shoot(G.px, G.py-20, 0, -BSPD*1.15, false, { dmg:dmg, r:7, pierce:2 });
  } else {
    firePattern();
    if (G.pwr.bishop>0){  // Bishop power — extra hard diagonals layered on the rank pattern
      shoot(G.px-7, G.py-12, -DIAG, -BSPD*0.95, false, { dmg:2, r:6, bishop:true });
      shoot(G.px+7, G.py-12,  DIAG, -BSPD*0.95, false, { dmg:2, r:6, bishop:true });
    }
  }
  sfx('shoot');
}

// ---------- pawn summon (King ability) ----------
function clusterPoint(){
  if (!G.enemies.length && !G.boss) return { x: G.px, y: 130 };
  let best=null, bestN=-1;
  G.enemies.forEach(e => {
    let n=0; G.enemies.forEach(o=>{ if(dist2(e.x,e.y,o.x,o.y) < 70*70) n++; });
    if (n>bestN){ bestN=n; best=e; }
  });
  if (best) return { x: best.x, y: best.y };
  if (G.boss) return { x: G.boss.x, y: G.boss.y };
  return { x: G.px, y: 130 };
}
function summon(){
  if (G.pawns<=0 || !G.running) return;
  const n = G.pawns; G.pawns = 0; updateSummonBtn();
  for (let i=0;i<n;i++){
    const tp = clusterPoint();
    G.ppawns.push({ x: G.px + rnd(-14,14), y: G.py-10, tx: tp.x + rnd(-22,22), ty: tp.y + rnd(-22,22), delay: i*0.07, t:0 });
  }
  sfx('pawn');
}
function explodePawn(x,y){
  const R=74;
  G.enemies.forEach(e => { if (dist2(x,y,e.x,e.y) < (R+e.r)*(R+e.r)) e.hp -= 4; });
  if (G.boss && dist2(x,y,G.boss.x,G.boss.y) < (R+34)*(R+34)) G.boss.hp -= 14 * (G.boss.vuln>0 ? 1.8 : 1);
  burst(x,y,'#ffd36b',26); G.shake = Math.max(G.shake, 7); sfx('boom');
}

// ---------- effects ----------
function burst(x,y,col,n){ for(let i=0;i<(n||12);i++){ const a=Math.random()*Math.PI*2, s=rnd(40,220); G.parts.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(0.3,0.7), max:0.7, col, sz:rnd(2,4) }); } }
function floater(txt,x,y,col,big){ G.floaters.push({ txt, x, y, col, life:big?1.4:0.9, max:big?1.4:0.9, big:!!big }); }
function ring(x,y,col){ G.rings.push({ x, y, col, r:12, life:0.55, max:0.55 }); }

// ---------- damage to enemies / kills ----------
function killEnemy(e, byPawn){
  G.score += Math.round(e.pts * G.mult);
  floater('+'+Math.round(e.pts*G.mult), e.x, e.y, '#ffe27a');
  burst(e.x, e.y, e.fill, 14); sfx('pop');
  G.combo++; G.mult = 1 + Math.min(4, Math.floor(G.combo/8));
  G.killAcc++;
  if (G.killAcc >= KILLS_PER_PAWN && G.pawns < MAX_PAWNS){ G.killAcc = 0; G.pawns++; updateSummonBtn(); floater('♟ +1', G.px, G.py-30, '#ffd36b'); sfx('charge'); }
  // power-up drop
  if (Math.random() < 0.09){ const p = POWERS[(Math.random()*POWERS.length)|0]; G.tokens.push({ kind:p, x:e.x, y:e.y, bx:e.x, seed:rnd(0,6), vy:80, t:0 }); }
}
function hurtPlayer(){
  if (G.inv>0) return;
  G.hearts--; G.inv = 1.3; G.combo = 0; G.mult = 1; G.shake = 12; G.flash = 0.5; sfx('hurt');
  if (G.hearts <= 0) gameOver(false);
}

// ---------- input ----------
const focusBtn=document.getElementById('focus-btn');
let mouseFocus=false;
function setFocus(v){ if(G) G.focus=v; if(focusBtn) focusBtn.classList.toggle('on', v); }
function toCanvas(cx,cy){ const r=canvas.getBoundingClientRect(); return { x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height) }; }
function pointerMove(e){ if(!G||!G.running) return; const p=toCanvas(e.clientX,e.clientY); G.tx=clamp(p.x,16,W-16); G.ty=clamp(p.y,60,H-24); }
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pointerMove(e); if(e.pointerType==='mouse'){ mouseFocus=true; setFocus(true); } });
canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pointerMove(e); });   // hover (mouse) or drag (touch)
window.addEventListener('pointerup', ()=>{ if(mouseFocus){ mouseFocus=false; setFocus(false); } });
// Focus button (touch-friendly): hold to concentrate fire.
if (focusBtn){
  focusBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); initAudio(); setFocus(true); });
  focusBtn.addEventListener('pointerup',   e=>{ e.preventDefault(); setFocus(false); });
  focusBtn.addEventListener('pointerleave', ()=> setFocus(false));
  focusBtn.addEventListener('pointercancel', ()=> setFocus(false));
}
window.addEventListener('keydown', e=>{
  if(!G||!G.running) return;
  if(e.key===' '){ e.preventDefault(); summon(); }
  else if(e.key==='Shift'){ setFocus(true); }
  const step=26;
  if(e.key==='ArrowLeft') G.tx=clamp(G.tx-step,16,W-16);
  else if(e.key==='ArrowRight') G.tx=clamp(G.tx+step,16,W-16);
  else if(e.key==='ArrowUp') G.ty=clamp(G.ty-step,60,H-24);
  else if(e.key==='ArrowDown') G.ty=clamp(G.ty+step,60,H-24);
});
window.addEventListener('keyup', e=>{ if(e.key==='Shift') setFocus(false); });

// ---------- update ----------
function update(dt){
  if (!G.running) return;
  G.time += dt;
  if (G.shake>0) G.shake = Math.max(0, G.shake-dt*30);
  if (G.flash>0) G.flash = Math.max(0, G.flash-dt*2);
  if (G.pflash>0) G.pflash = Math.max(0, G.pflash-dt*2);
  if (G.inv>0) G.inv -= dt;
  if (G.bannerT>0) G.bannerT -= dt;
  // background scroll
  G.bg.forEach(b=>{ b.y += (30+b.z*60)*dt; if(b.y>H){ b.y=-4; b.x=Math.random()*W; } });

  // interstitial between regions
  if (G.phase==='interstitial'){
    G.interT -= dt; updateParts(dt);
    if (G.interT<=0){
      if (G.nextRegion > REGIONS.length){
        if (G.endless){ G.loop++; G.nextRegion=1; startRegion(1); G.banner='LOOP '+G.loop+' ▸ THE SEA RISES'; G.bannerT=2.4; }
        else { gameOver(true); return; }
      } else startRegion(G.nextRegion);
    }
    return;
  }

  // player follow — focus eases her in slower, for precision
  const followLerp = G.focus ? 8 : 14;
  G.px += (G.tx-G.px)*Math.min(1, dt*followLerp);
  G.py += (G.ty-G.py)*Math.min(1, dt*followLerp);

  // fire — cadence grows as she rises
  G.fireCd -= dt;
  if (G.fireCd<=0){ fire(); G.fireCd = RANK_FIRE_CD[G.rank]; }
  // power timers
  for (const k in G.pwr){ if (G.pwr[k]>0) G.pwr[k]=Math.max(0,G.pwr[k]-dt); }
  // escorts (knight)
  if (G.pwr.knight>0){
    if (G.escorts.length<2){ G.escorts=[{off:-36,cd:0},{off:36,cd:0}]; }
    G.escorts.forEach(es=>{ es.x=G.px+es.off; es.y=G.py+6; es.cd-=dt; if(es.cd<=0){ shoot(es.x,es.y-10,0,-BSPD,false); es.cd=0.2; } });
  } else if (G.escorts.length){ G.escorts.length=0; }

  // spawn director
  while (G.toSpawn.length && G.toSpawn[0].time<=G.time){ spawnEnemy(G.toSpawn.shift().type); }
  if (!G.boss && !G.toSpawn.length && G.enemies.length<=1 && G.phase==='play'){
    if (G.waveIdx >= G.wavesInRegion) startBoss(); else startWave();
  }

  updateEnemies(dt);
  updateBoss(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updatePawns(dt);
  updateTokens(dt);
  updateDog(dt);
  updateParts(dt);
  updateRings(dt);
  for (let i=G.floaters.length-1;i>=0;i--){ const f=G.floaters[i]; f.y-=24*dt; f.life-=dt; if(f.life<=0) G.floaters.splice(i,1); }
}

function updateEnemies(dt){
  for (let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i]; e.t+=dt;
    if (e.pat==='zigzag'){ e.x += Math.sin(e.t*2.4+e.seed)*70*dt; e.y += e.vy*dt; }
    else if (e.pat==='hop'){ e.x += Math.sin(e.t*3.2+e.seed)*90*dt; e.y += e.vy*dt*(0.7+0.5*Math.abs(Math.cos(e.t*3))); }
    else if (e.pat==='weave'){ e.x += Math.sin(e.t*1.6+e.seed)*54*dt; e.y += e.vy*dt; }
    else { e.y += e.vy*dt; }
    e.x = clamp(e.x, e.r, W-e.r);
    // queen shoots
    if (e.shoots){ e.shootCd-=dt; if(e.shootCd<=0 && e.y>0 && e.y<H*0.6){ enemyShoot(e.x,e.y,G.px,G.py); e.shootCd=rnd(1.6,2.8); } }
    // leak
    if (e.y - e.r > H){ G.enemies.splice(i,1); G.combo=0; G.mult=1; G.hearts--; G.flash=0.4; G.shake=8; sfx('hurt'); floater('LEAK!', e.x, H-30, '#ff5b6e'); if(G.hearts<=0){ gameOver(false); return; } continue; }
    // hit player
    if (G.inv<=0 && dist2(e.x,e.y,G.px,G.py) < (e.r+G.pr)*(e.r+G.pr)){ burst(e.x,e.y,e.fill,12); G.enemies.splice(i,1); hurtPlayer(); continue; }
    // death
    if (e.hp<=0){ G.enemies.splice(i,1); killEnemy(e); }
  }
}

function enemyShoot(x,y,tx,ty){ const a=Math.atan2(ty-y,tx-x); const sp=180; G.ebullets.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:5 }); }

function updateBoss(dt){
  const b=G.boss; if(!b) return; b.t+=dt;
  if (b.entering){ b.y += 70*dt; if(b.y>=b.ty){ b.y=b.ty; b.entering=false; b.vulnCd=6; } return; }
  // weak-point rhythm — it opens up, stops firing, and takes bonus damage
  if (b.vuln>0){ b.vuln-=dt; }
  else { b.vulnCd-=dt; if (b.vulnCd<=0){ b.vuln=2.4; b.vulnCd=7.5; sfx('charge'); floater('WEAK POINT!', b.x, b.y-46, '#6bffb8'); } }
  // drift (the hopper teleports instead, in bossFire)
  if (b.kind!=='burst'){ b.x += b.dir*70*dt; if(b.x<60){b.x=60;b.dir=1;} if(b.x>W-60){b.x=W-60;b.dir=-1;} }
  // CEO phase by health
  if (b.kind==='ceo'){ const p=b.hp/b.maxhp; b.phase = p>0.6?1:(p>0.3?2:3); }
  // fire (paused while the guard is down — that's your window)
  if (b.vuln<=0){ b.fireCd-=dt; if (b.fireCd<=0) bossFire(b); }
  // reinforcements
  if (b.kind==='royal' || b.kind==='ceo'){
    b.addCd-=dt;
    if (b.addCd<=0){ const t = (b.kind==='ceo' && b.phase>=2) ? 'knight' : 'pawn';
      spawnEnemy(t, b.x-30); spawnEnemy(t, b.x+30); b.addCd = b.kind==='ceo' ? 4.5 : 6; }
  }
  if (b.hp<=0){ bossDefeated(); }
}
// Deterministic firing (time-driven, no Math.random) so Daily stays identical for everyone.
function bossFire(b){
  const t=b.t, cy=b.y+28;
  if (b.kind==='aim'){                     // Checker Town — a gentle aimed spread
    for(let k=0;k<3;k++){ const a=Math.PI/2+(k-1)*0.34; G.ebullets.push({x:b.x,y:cy,vx:Math.cos(a)*210,vy:Math.sin(a)*210,r:6}); }
    b.fireCd=1.5;
  } else if (b.kind==='sweep'){            // Open Sea — a falling wall with a moving gap to weave
    const gap = Math.floor((Math.sin(t*0.9)*0.5+0.5)*6);
    for(let c=0;c<8;c++){ if(c===gap||c===gap+1) continue; const x=30+c*(W-60)/7; G.ebullets.push({x:x,y:cy,vx:0,vy:155,r:6}); }
    b.fireCd=1.1;
  } else if (b.kind==='burst'){            // Shogi Isle — hops across, then a radial burst
    b.x = clamp(W/2 + Math.sin(t*1.3)*150, 60, W-60);
    const n=10; for(let k=0;k<n;k++){ const a=(k/n)*Math.PI*2 + t; G.ebullets.push({x:b.x,y:b.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:5}); }
    b.fireCd=1.7;
  } else if (b.kind==='royal'){            // Chess City — a wide, fast spread (adds handled above)
    for(let k=0;k<5;k++){ const a=Math.PI/2+(k-2)*0.26; G.ebullets.push({x:b.x,y:cy,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:6}); }
    b.fireCd=1.2;
  } else {                                 // THE CEO — three phases, escalating
    if (b.phase===1){ for(let k=0;k<5;k++){ const a=Math.PI/2+(k-2)*0.28; G.ebullets.push({x:b.x,y:cy,vx:Math.cos(a)*230,vy:Math.sin(a)*230,r:6}); } b.fireCd=1.1; }
    else if (b.phase===2){ const n=12; for(let k=0;k<n;k++){ const a=(k/n)*Math.PI*2 + t*1.5; G.ebullets.push({x:b.x,y:b.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5}); } b.fireCd=1.3; }
    else { const n=8; for(let k=0;k<n;k++){ const a=(k/n)*Math.PI*2 + t; G.ebullets.push({x:b.x,y:b.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:5}); }
      const aa=Math.atan2(G.py-b.y,G.px-b.x); G.ebullets.push({x:b.x,y:b.y,vx:Math.cos(aa)*280,vy:Math.sin(aa)*280,r:7}); b.fireCd=0.9; }
  }
  sfx('boss');
}
// Two-panel story beats between regions (Avenue 1 tie — the show, in-game).
const STORY_BEATS = {
  1: { a:['🏠','🌊'], cap:['Checker Town below.','Open sea ahead.'] },
  2: { a:['🌊','⛩'], cap:['Across the water.','Shogi Isle rises.'] },
  3: { a:['⛩','🏙️'], cap:['The island fades.','Chess City gleams.'] },
  4: { a:['🏙️','🚪'], cap:['A door marked ★','The CEO waits.'] }
};
function bossDefeated(){
  const b=G.boss; burst(b.x,b.y,curRegion().glow,60); G.shake=16; sfx('boom');
  G.score += 500*G.region; floater('BOSS +'+(500*G.region), b.x, b.y, '#ffe27a');
  G.boss=null; G.ebullets.length=0;
  const last = G.region>=REGIONS.length;
  // Princess rises a rank for every region she clears — pawn to queen by the gate.
  G.promo = null;
  if (!last && G.rank < 4){ G.rank++; G.promo = RANK_NAME[G.rank]; G.pflash=0.8; G.pflashCol=RANK_COL[G.rank]; sfx('power'); }
  G.beat = last ? null : STORY_BEATS[G.region];
  G.phase='interstitial'; G.interT=2.6; G.nextRegion=G.region+1;
  G.banner = last ? (G.endless ? 'THE SEA RISES AGAIN' : 'YOU REACHED THE TOP')
                  : (G.promo ? 'RISEN — ' + G.promo.toUpperCase() : 'REGION CLEARED'); G.bannerT=2.6;
  sfx(G.promo ? 'charge' : 'win');
}
function drawInterstitial(){
  const beat=G.beat; if(!beat) return;
  const cy=H*0.52, pw=W*0.36, ph=pw*0.66, gap=W*0.08;
  const xs=[W/2-gap/2-pw, W/2+gap/2];
  ctx.save();
  ctx.fillStyle='rgba(5,6,15,0.55)'; ctx.fillRect(0,cy-ph*0.7,W,ph*1.4);
  for(let i=0;i<2;i++){
    const x=xs[i];
    ctx.fillStyle='#0a0f24'; ctx.fillRect(x,cy-ph/2,pw,ph);
    ctx.strokeStyle='#8fb8ff'; ctx.lineWidth=2; ctx.strokeRect(x,cy-ph/2,pw,ph);
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(pw*0.4)+'px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(beat.a[i], x+pw/2, cy-ph*0.1);
    ctx.fillStyle='#cfe0ff'; ctx.font='bold 10px Trebuchet MS';
    ctx.fillText(beat.cap[i], x+pw/2, cy+ph*0.32);
  }
  ctx.fillStyle='#ffe27a'; ctx.font='bold 22px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('→', W/2, cy);
  if (G.promo){ ctx.fillStyle=RANK_COL[G.rank]; ctx.font='bold 13px Trebuchet MS';
    ctx.fillText('Princess rises   '+RANK_GLYPH[G.rank-1]+' → '+RANK_GLYPH[G.rank], W/2, cy+ph*0.72); }
  ctx.restore();
}

function updateBullets(dt){
  for (let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if (b.y<-12||b.y>H+12||b.x<-12||b.x>W+12){ G.bullets.splice(i,1); continue; }
    let gone=false;
    // boss
    if (G.boss && !G.boss.entering && dist2(b.x,b.y,G.boss.x,G.boss.y) < (34+b.r)*(34+b.r)){
      G.boss.hp -= b.dmg * (G.boss.vuln>0 ? 1.8 : 1); burst(b.x,b.y, G.boss.vuln>0?'#6bffb8':'#fff', G.boss.vuln>0?6:4);
      if (b.pierce>0 && b.hit!==G.boss){ b.pierce--; b.hit=G.boss; } else gone=true;
    }
    if (!gone) for (let j=G.enemies.length-1;j>=0;j--){
      const e=G.enemies[j];
      if (e!==b.hit && dist2(b.x,b.y,e.x,e.y) < (e.r+b.r)*(e.r+b.r)){
        e.hp-=b.dmg; burst(b.x,b.y,'#fff',3);
        if (e.hp<=0){ G.enemies.splice(j,1); killEnemy(e); }
        if (b.pierce>0){ b.pierce--; b.hit=e; } else { gone=true; }
        break;
      }
    }
    if (gone) G.bullets.splice(i,1);
  }
}
function updateEBullets(dt){
  for (let i=G.ebullets.length-1;i>=0;i--){
    const b=G.ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if (b.y>H+12||b.y<-12||b.x<-12||b.x>W+12){ G.ebullets.splice(i,1); continue; }
    if (G.inv<=0 && dist2(b.x,b.y,G.px,G.py) < (b.r+G.pr)*(b.r+G.pr)){ G.ebullets.splice(i,1); hurtPlayer(); }
  }
}
function updatePawns(dt){
  for (let i=G.ppawns.length-1;i>=0;i--){
    const p=G.ppawns[i];
    if (p.delay>0){ p.delay-=dt; p.x=G.px; p.y=G.py-10; continue; }
    p.t+=dt;
    const a=Math.atan2(p.ty-p.y, p.tx-p.x); p.x+=Math.cos(a)*PAWNSPD*dt; p.y+=Math.sin(a)*PAWNSPD*dt;
    if (dist2(p.x,p.y,p.tx,p.ty) < 16*16 || p.t>2.2){ explodePawn(p.x,p.y); G.ppawns.splice(i,1); }
  }
}
function applyPower(kind, x, y){
  const col = POWER_COL[kind];
  G.pwr[kind] = Math.min(PWR_CAP, G.pwr[kind] + PWR_DUR[kind]);
  floater(POWER_NAME[kind], G.px, G.py-40, col, true);
  burst(x, y, col, 24); ring(G.px, G.py, col);
  G.pflash = 0.6; G.pflashCol = col; G.shake = Math.max(G.shake, 6);
  sfx('power'); G.score += 25;
}
function updateTokens(dt){
  for (let i=G.tokens.length-1;i>=0;i--){
    const tk=G.tokens[i]; tk.t+=dt; tk.y+=tk.vy*dt;
    tk.x = tk.bx + Math.sin(tk.t*3 + tk.seed)*12;   // gentle wobble as it falls
    if (tk.y>H+16){ G.tokens.splice(i,1); continue; }
    if (dist2(tk.x,tk.y,G.px,G.py) < (18+G.pr)*(18+G.pr)){
      applyPower(tk.kind, G.px, G.py);
      G.tokens.splice(i,1);
    }
  }
}
// ---------- Crockett, the wing-dog (follow the dog) — fetches power-ups, chomps stragglers ----------
function updateDog(dt){
  const d=G.dog; if(!d) return; d.t+=dt;
  d.biteCd-=dt; d.fetchCd-=dt; if(d.bark>0) d.bark-=dt;
  // free & off cooldown? go fetch the nearest unclaimed token
  if (d.mode==='follow' && d.fetchCd<=0 && G.tokens.length){
    let best=null, bd=1e9;
    G.tokens.forEach(tk=>{ if(tk.claimed) return; const dd=dist2(d.x,d.y,tk.x,tk.y); if(dd<bd){ bd=dd; best=tk; } });
    if (best){ best.claimed=true; d.mode='toToken'; d.target=best; }
  }
  // default: follow, hovering at her flank (also the fallback if a fetch falls through)
  let tx = G.px + (G.px<W/2 ? 40 : -40), ty = G.py+16;
  if (d.mode==='toToken' && d.target){
    const tk=d.target, idx=G.tokens.indexOf(tk);
    if (idx===-1){ d.mode='follow'; d.target=null; }           // player grabbed it first
    else { tx=tk.x; ty=tk.y;
      if (dist2(d.x,d.y,tk.x,tk.y) < 20*20){                    // got it — carry it home
        G.tokens.splice(idx,1); d.carry=tk.kind; d.mode='carry'; d.target=null;
        burst(d.x,d.y,POWER_COL[tk.kind],10); d.bark=0.25; sfx('pawn');
      }
    }
  } else if (d.mode==='carry'){
    tx = G.px + (G.px<W/2 ? 34 : -34); ty = G.py+10;
    if (dist2(d.x,d.y,tx,ty) < 22*22){                          // delivered
      applyPower(d.carry, G.px, G.py); d.carry=null; d.mode='follow'; d.fetchCd=2.6;
    }
  }
  d.x += (tx-d.x)*Math.min(1, dt*6); d.y += (ty-d.y)*Math.min(1, dt*6);
  // chomp — a short perimeter bite on the nearest enemy
  if (d.biteCd<=0){
    for (let i=0;i<G.enemies.length;i++){ const e=G.enemies[i];
      if (dist2(d.x,d.y,e.x,e.y) < (e.r+16)*(e.r+16)){
        e.hp -= 2; burst(d.x,d.y,'#ffd36b',8); d.bark=0.22; d.biteCd=0.5; sfx('pop');
        if (e.hp<=0){ G.enemies.splice(i,1); killEnemy(e); }
        break;
      }
    }
  }
}
function updateParts(dt){ for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy=p.vy*0.94+60*dt; p.life-=dt; if(p.life<=0) G.parts.splice(i,1); } }
function updateRings(dt){ for(let i=G.rings.length-1;i>=0;i--){ const r=G.rings[i]; r.r+=420*dt; r.life-=dt; if(r.life<=0) G.rings.splice(i,1); } }

// ---------- render ----------
function render(){
  const r = curRegion();
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,r.sky[0]); g.addColorStop(1,r.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax specks
  G.bg.forEach(b=>{ ctx.globalAlpha=0.15+b.z*0.25; ctx.fillStyle=r.glow; ctx.fillRect(b.x, b.y, b.s, b.s*2.4); });
  ctx.globalAlpha=1;

  ctx.save();
  if (G.shake>0) ctx.translate(rnd(-G.shake,G.shake)*0.4, rnd(-G.shake,G.shake)*0.4);

  // tokens (power-ups) — made loud while falling so you chase them
  G.tokens.forEach(tk=>{
    const col = POWER_COL[tk.kind];
    const pulse = 0.5 + 0.5*Math.sin(tk.t*7);
    ctx.save();
    // upward sparkle trail
    for (let k=1;k<=4;k++){
      ctx.globalAlpha = 0.18*(1 - k/5);
      ctx.fillStyle = col;
      const ty = tk.y - k*11;
      const tx = tk.bx + Math.sin((tk.t - k*0.05)*3 + tk.seed)*12;
      ctx.beginPath(); ctx.arc(tx, ty, 6 - k*0.9, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // expanding "grab me" halo
    ctx.globalAlpha = 0.5*(1 - pulse);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tk.x, tk.y, 16 + pulse*12, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
    // glow aura
    ctx.shadowColor = col; ctx.shadowBlur = 16 + pulse*10;
    ctx.fillStyle = col; ctx.globalAlpha = 0.30 + 0.25*pulse;
    ctx.beginPath(); ctx.arc(tk.x, tk.y, 17, 0, 7); ctx.fill();
    ctx.restore();
    // solid core coin
    ctx.fillStyle='#0a0f24'; ctx.beginPath(); ctx.arc(tk.x,tk.y,13,0,7); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke();
    glyph(tk.x,tk.y,POWER_GLYPH[tk.kind],17,col);
    // downward chevron pointer
    ctx.globalAlpha = 0.5 + 0.5*pulse;
    glyph(tk.x, tk.y + 26 + pulse*3, '▾', 14, col);
    ctx.globalAlpha = 1;
  });

  // enemies
  G.enemies.forEach(e=>drawEnemy(e));
  // boss
  if (G.boss) drawBoss(G.boss);
  // enemy bullets
  G.ebullets.forEach(b=>{ ctx.fillStyle='#ff5b6e'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.fillStyle='rgba(255,150,160,0.5)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+2,0,7); ctx.fill(); });
  // pawns (summoned)
  G.ppawns.forEach(p=>{ ctx.save(); ctx.shadowColor='#ffd36b'; ctx.shadowBlur=10; glyph(p.x,p.y,'♙',22,'#ffe27a'); ctx.restore(); });
  // player bullets
  G.bullets.forEach(b=>{
    const col = b.bishop ? '#d9b3ff' : (b.sup?'#ff8fd0':'#9fe8ff');
    if (b.bishop){ ctx.save(); ctx.shadowColor='#c79bff'; ctx.shadowBlur=10; }
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    if(b.sup){ ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+3,0,7); ctx.fill(); ctx.globalAlpha=1; }
    if (b.bishop) ctx.restore();
  });
  // escorts
  G.escorts.forEach(es=>{ glyph(es.x,es.y,'♘',20,'#8fe3ff'); });
  // Crockett (behind Princess) then Princess
  drawDog();
  drawPrincess();
  // particles
  G.parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); }); ctx.globalAlpha=1;
  // shockwave rings (power-up collection)
  G.rings.forEach(r=>{ ctx.globalAlpha=Math.max(0,r.life/r.max); ctx.strokeStyle=r.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); }); ctx.globalAlpha=1;
  // floaters
  G.floaters.forEach(f=>{ ctx.globalAlpha=Math.max(0,f.life/f.max); ctx.font='bold '+(f.big?22:15)+'px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; if(f.big){ ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=4; ctx.strokeText(f.txt,f.x,f.y); } ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y); }); ctx.globalAlpha=1;

  ctx.restore();
  drawHUD();
  if (G.flash>0){ ctx.fillStyle='rgba(255,40,60,'+(G.flash*0.4)+')'; ctx.fillRect(0,0,W,H); }
  if (G.pflash>0){ ctx.fillStyle='rgba('+hexToRgb(G.pflashCol)+','+(G.pflash*0.3)+')'; ctx.fillRect(0,0,W,H); }
  if (G.phase==='interstitial' && G.beat) drawInterstitial();
  if (G.bannerT>0) drawBanner();
}
function glyph(x,y,ch,size,col){ ctx.font='900 '+size+'px "Segoe UI Symbol","Noto Sans Symbols2",serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillText(ch,x+1,y+2); ctx.fillStyle=col; ctx.fillText(ch,x,y); }
function drawEnemy(e){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(e.x,e.y+e.r*0.7,e.r*0.7,e.r*0.28,0,0,7); ctx.fill();
  const grd=ctx.createRadialGradient(e.x-e.r*0.3,e.y-e.r*0.3,2,e.x,e.y,e.r);
  grd.addColorStop(0,'#fff'); grd.addColorStop(0.3,e.fill); grd.addColorStop(1,'#241a3c');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill();
  ctx.restore();
  glyph(e.x,e.y,e.glyph,e.r*1.3,'#1a1030');
  if (e.hp<e.maxhp){ const w=e.r*1.8, pct=Math.max(0,e.hp/e.maxhp); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(e.x-w/2,e.y-e.r-7,w,3); ctx.fillStyle='#6bffb8'; ctx.fillRect(e.x-w/2,e.y-e.r-7,w*pct,3); }
}
function drawBoss(b){
  const open = b.vuln>0;
  ctx.save(); ctx.shadowColor = open?'#6bffb8':curRegion().glow; ctx.shadowBlur = open?30:22;
  const grd=ctx.createRadialGradient(b.x-12,b.y-12,4,b.x,b.y,40);
  grd.addColorStop(0,'#fff'); grd.addColorStop(0.4, open?'#6bffb8':curRegion().glow); grd.addColorStop(1,'#3a0a18');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(b.x,b.y,36,0,7); ctx.fill(); ctx.restore();
  glyph(b.x,b.y,'♚',46,'#1a0810');
  if (open){ ctx.fillStyle='#6bffb8'; ctx.font='bold 10px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('WEAK POINT', b.x, b.y-44); }
}
function heart(x,y,full){ ctx.font='16px Trebuchet MS'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle=full?'#ff5b6e':'rgba(120,60,70,0.5)'; ctx.fillText(full?'♥':'♡',x,y); }
function drawHUD(){
  // hearts
  for (let i=0;i<Math.max(START_HEARTS,G.hearts);i++) heart(12+i*20, 18, i<G.hearts);
  // score
  ctx.fillStyle='#ffe27a'; ctx.font='bold 18px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(G.score), W/2, 18);
  // region + combo
  ctx.fillStyle='#cfe0ff'; ctx.font='11px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText((curRegion().secret?'★ ':'')+curRegion().name, W/2, 36);
  if (G.daily){ ctx.fillStyle='#9fe8ff'; ctx.font='9px Trebuchet MS'; ctx.textAlign='left'; ctx.fillText('📅 DAILY '+dayStr(), 12, 36); }
  if (G.mult>1){ ctx.fillStyle='#9fe8ff'; ctx.font='bold 12px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText('x'+G.mult+' combo', W-12, 36); }
  // power timers (top-right icons)
  let py=54; ['queen','bishop','knight'].forEach(k=>{ if(G.pwr[k]>0){ ctx.textAlign='right'; glyph(W-20,py,POWER_GLYPH[k],16,POWER_COL[k]);
    ctx.fillStyle=POWER_COL[k]; ctx.font='10px Trebuchet MS'; ctx.textAlign='right'; ctx.fillText(Math.ceil(G.pwr[k])+'s', W-32, py); py+=20; } });
  // rank badge + pawn charge — centered at the bottom, clear of the corner buttons
  ctx.textBaseline='middle';
  glyph(W/2-34, H-34, RANK_GLYPH[G.rank], 15, RANK_COL[G.rank]);
  ctx.fillStyle=RANK_COL[G.rank]; ctx.font='bold 12px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText(RANK_NAME[G.rank], W/2+4, H-34);
  const pn=MAX_PAWNS, psx=W/2-(pn*14)/2;
  for (let i=0;i<pn;i++){ ctx.fillStyle = i<G.pawns ? '#ffd36b':'rgba(255,211,107,0.18)'; ctx.beginPath(); ctx.arc(psx+8+i*14, H-16, 4.5, 0, 7); ctx.fill(); }
  // boss hp bar
  if (G.boss && !G.boss.entering){ const bw=W-80, pct=Math.max(0,G.boss.hp/G.boss.maxhp);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(40,52,bw,8); ctx.fillStyle='#ff5b6e'; ctx.fillRect(40,52,bw*pct,8);
    ctx.strokeStyle='#ffb0bb'; ctx.lineWidth=1; ctx.strokeRect(40,52,bw,8);
    ctx.fillStyle='#ffd9df'; ctx.font='9px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText(G.boss.name, W/2, 47); }
}
function drawDog(){
  const d=G.dog; if(!d) return;
  const bob=Math.sin(d.t*8)*2;
  ctx.save();
  ctx.shadowColor = (d.mode==='carry' && d.carry) ? POWER_COL[d.carry] : '#ffd36b';
  ctx.shadowBlur = (d.mode==='carry') ? 16 : 8;
  ctx.font='20px "Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🐕', d.x, d.y+bob);
  ctx.restore();
  if (d.bark>0){ ctx.globalAlpha=Math.min(1,d.bark*4); glyph(d.x+11, d.y-11+bob, '!', 13, '#fff'); ctx.globalAlpha=1; }
}
function drawPrincess(){
  const x=G.px, y=G.py;
  if (G.inv>0 && Math.floor(G.time*16)%2===0) return; // blink when hit
  const aura=RANK_AURA[G.rank], col=RANK_COL[G.rank];
  // thruster
  ctx.fillStyle='rgba(255,180,80,'+(0.5+0.3*Math.sin(G.time*30))+')';
  ctx.beginPath(); ctx.moveTo(x-6,y+14); ctx.lineTo(x,y+14+rnd(8,16)); ctx.lineTo(x+6,y+14); ctx.closePath(); ctx.fill();
  // focus — a tightening ring + a visible pinpoint hitbox
  if (G.focus){
    ctx.strokeStyle='rgba(159,232,255,0.85)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,G.pr+8+Math.sin(G.time*10)*2,0,7); ctx.stroke();
    ctx.fillStyle='#9fe8ff'; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();
  }
  // body glow + her current rank piece
  ctx.save(); ctx.shadowColor=aura; ctx.shadowBlur=14+G.rank*2;
  ctx.fillStyle='#33196e'; ctx.beginPath(); ctx.arc(x,y,G.pr,0,7); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke(); ctx.restore();
  glyph(x,y,RANK_GLYPH[G.rank],22,'#f0e6ff');
}
function drawBanner(){ const a=Math.min(1,G.bannerT/0.4)*Math.min(1,(2.6-Math.max(0,2.6-G.bannerT))); ctx.globalAlpha=Math.min(1,G.bannerT); ctx.fillStyle='#ffe27a'; ctx.font='900 26px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=5; ctx.strokeText(G.banner,W/2,H*0.32); ctx.fillText(G.banner,W/2,H*0.32); ctx.globalAlpha=1; }

// ---------- summon button ----------
function updateSummonBtn(){ const b=document.getElementById('summon-btn'); if(!b||!G) return; b.classList.toggle('empty', G.pawns<=0); b.innerHTML='♚ SUMMON<small>'+G.pawns+' pawn'+(G.pawns===1?'':'s')+'</small>'; }

// ---------- loop ----------
let lastT=performance.now();
function loop(now){ const dt=Math.min(0.04,(now-lastT)/1000); lastT=now; if(G){ update(dt); render(); } requestAnimationFrame(loop); }

// ---------- screens ----------
function gameOver(won){
  G.running=false; G.over=true;
  if (G.score>G.best){ G.best=G.score; (G.daily?saveBestD:(G.endless?saveBestE:saveBest))(G.best); }
  if (window.PJCC && PJCC.saveScore) PJCC.saveScore(G.daily?'sky-run-daily':(G.endless?'sky-run-endless':'sky-run'), G.score, { credits: 1+G.region, data: { region:G.region, won:won, mode:G.mode, loop:G.loop } });
  setFocus(false);
  document.getElementById('menu-btn').classList.add('hidden');
  document.getElementById('summon-btn').classList.add('hidden');
  document.getElementById('focus-btn').classList.add('hidden');
  document.getElementById('res-eye').textContent = won ? 'The summit' : 'Shot down';
  document.getElementById('res-title').textContent = won ? 'CHESS CITY REACHED ★' : 'SKY RUN';
  document.getElementById('res-msg').innerHTML = (won
      ? 'Princess rose from a pawn all the way to the <b>Queen</b> — and flew the whole sky, through the CEO\'s Office and out the other side.'
      : 'Princess went down over <b>'+curRegion().name+'</b>, a '+RANK_NAME[G.rank]+'.') +
    '<br>Score <b>'+G.score+'</b>' + (G.score>=G.best?' · <span style="color:#6bffb8">new best!</span>':' · best '+G.best);
  sfx(won?'win':'lose');
  document.getElementById('result').classList.remove('hidden');
}
let curMode='normal';
function startPlay(mode){ curMode=mode||'normal'; initAudio(); if(actx&&actx.state==='suspended') actx.resume();
  document.getElementById('menu').classList.add('hidden'); document.getElementById('result').classList.add('hidden');
  document.getElementById('menu-btn').classList.remove('hidden'); document.getElementById('summon-btn').classList.remove('hidden');
  document.getElementById('focus-btn').classList.remove('hidden');
  newGame(curMode); updateSummonBtn(); setFocus(false);
}
// Photo-mode end-card — a shareable PNG of your run
function saveCard(){
  if (!G) return;
  const cw=600, ch=315, cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; const cx=cv.getContext('2d');
  const r=curRegion();
  const grd=cx.createLinearGradient(0,0,0,ch); grd.addColorStop(0, r.sky?r.sky[0]:'#0a0f24'); grd.addColorStop(1,'#05060f');
  cx.fillStyle=grd; cx.fillRect(0,0,cw,ch);
  cx.strokeStyle='#8fb8ff'; cx.lineWidth=4; cx.strokeRect(8,8,cw-16,ch-16);
  cx.textAlign='center';
  const tag = G.daily?' · DAILY':(G.endless?' · ENDLESS':'');
  cx.fillStyle='#8fb8ff'; cx.font='bold 16px Trebuchet MS'; cx.fillText('PJCC · SKY RUN'+tag, cw/2, 50);
  cx.fillStyle='#ffe27a'; cx.font='900 70px Trebuchet MS'; cx.fillText(String(G.score), cw/2, 152);
  cx.fillStyle='#cfe0ff'; cx.font='600 18px Trebuchet MS'; cx.fillText('score', cw/2, 180);
  cx.fillStyle='#f0e6ff'; cx.font='bold 22px Trebuchet MS';
  const won = G.over && G.region>=REGIONS.length && !G.endless;
  cx.fillText((won?'Reached Chess City ★':'Down over '+r.name) + (G.endless?(' · loop '+G.loop):''), cw/2, 224);
  cx.fillStyle='#cfe0ff'; cx.font='600 15px Trebuchet MS'; cx.fillText(won?'crowned the Queen':'rose to '+RANK_NAME[G.rank], cw/2, 248);
  cx.fillStyle='#9fe8ff'; cx.font='600 15px Trebuchet MS'; cx.fillText('best '+G.best+'   ·   mcpuppystudios.com', cw/2, 270);
  cx.font='40px "Segoe UI Symbol","Noto Sans Symbols2",serif'; cx.fillStyle='#f0e6ff'; cx.fillText(RANK_GLYPH[G.rank], cw/2, 300);
  const a=document.createElement('a'); a.download='sky-run-'+G.score+'.png'; a.href=cv.toDataURL('image/png'); a.click();
}
function openMenu(){ if(G) G.running=false; setFocus(false); document.getElementById('result').classList.add('hidden'); document.getElementById('menu-btn').classList.add('hidden'); document.getElementById('summon-btn').classList.add('hidden'); document.getElementById('focus-btn').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); }

document.getElementById('play-btn').addEventListener('click', function(){ startPlay('normal'); });
document.getElementById('daily-btn').addEventListener('click', function(){ startPlay('daily'); });
document.getElementById('endless-btn').addEventListener('click', function(){ startPlay('endless'); });
document.getElementById('retry-btn').addEventListener('click', function(){ startPlay(curMode); });
document.getElementById('card-btn').addEventListener('click', saveCard);
document.getElementById('menu-btn').addEventListener('click', openMenu);
document.getElementById('menu-btn2').addEventListener('click', openMenu);
document.getElementById('summon-btn').addEventListener('click', summon);

document.getElementById('best-line').textContent = 'Best: ' + (loadBest() || '—');
requestAnimationFrame(loop);
</script>
