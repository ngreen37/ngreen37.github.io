<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PJCC: Siege on Chess City</title>
<script src="/assets/js/pjcc-config.js"></script>
<script src="/assets/js/pjcc-profile.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold:#F5C518; --pink:#ff8fd0; --light:#3d2a7a; --dark:#2D1B69; --ink:#f0e6ff; --good:#6bffb8; --bad:#ff6b6b; }
  html, body { background: #120a28; color: var(--ink);
    font-family: 'Trebuchet MS','Segoe UI',sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: flex-start; justify-content: center; min-height: 0; padding: 8px; }
  #wrap { width: 100%; max-width: 720px; }

  .hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .stat { background: #1d1140; border: 1px solid #4a3a86; border-radius: 8px; padding: 5px 11px; font-size: 14px; font-weight: bold; }
  .stat .lbl { color: #9a7fd4; font-weight: normal; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-right: 5px; }
  .stat.gold b { color: var(--gold); } .stat.lives b { color: var(--pink); } .stat.wave b { color: var(--good); }
  .stat.score b { color: #9ad0ff; }
  .hud .spacer { flex: 1; }

  .stage { position: relative; width: 100%; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 660 / 396;
    background: #160c33; border: 2px solid var(--gold); border-radius: 8px; touch-action: manipulation; cursor: pointer; }

  /* decree charge bar */
  .decree-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .decree-meter { flex: 1; height: 14px; background: #1d1140; border: 1px solid #4a3a86; border-radius: 999px; overflow: hidden; }
  .decree-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ff8fd0,#F5C518); transition: width 0.2s; }
  .decree-btn { background: #2a1a5e; color: #6b5fa0; border: 1px solid #4a3a86; border-radius: 999px;
    padding: 7px 15px; font-weight: 800; font-size: 13px; cursor: not-allowed; white-space: nowrap; font-family: inherit; }
  .decree-btn.ready { background: linear-gradient(135deg,var(--pink),var(--gold)); color: #1a0f3d; cursor: pointer;
    box-shadow: 0 0 14px rgba(245,197,24,0.6); animation: decreePulse 1.1s ease-in-out infinite; }
  @keyframes decreePulse { 0%,100% { box-shadow: 0 0 10px rgba(245,197,24,0.5); } 50% { box-shadow: 0 0 20px rgba(245,197,24,0.9); } }

  .shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 9px; }
  .twr { background: #1d1140; border: 1px solid #4a3a86; border-radius: 9px; padding: 7px 4px 6px; text-align: center;
    cursor: pointer; transition: border-color 0.12s, background 0.12s; user-select: none; }
  .twr:hover { border-color: #7a68c0; }
  .twr.sel { border-color: var(--gold); background: #2a1a5e; box-shadow: 0 0 10px rgba(245,197,24,0.35); }
  .twr.cant { opacity: 0.45; }
  .twr .g { font-size: 22px; line-height: 1; color: var(--gold); }
  .twr .nm { font-size: 10px; font-weight: bold; margin-top: 2px; letter-spacing: 0.3px; }
  .twr .ct { font-size: 11px; color: var(--good); margin-top: 1px; }

  .actions { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
  button.act { background: var(--dark); color: var(--ink); border: 1px solid #6b5fa0; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: inherit; }
  button.act.primary { background: var(--gold); color: #1a0f3d; border-color: var(--gold); }
  button.act:hover { border-color: var(--gold); }
  button.act:disabled { opacity: 0.45; cursor: default; }
  .hint { font-size: 12px; color: #9a7fd4; }

  /* tower inspector popup */
  .insp { position: absolute; background: #221346; border: 1px solid var(--gold); border-radius: 10px; padding: 10px;
    width: 160px; z-index: 10; box-shadow: 0 6px 24px rgba(0,0,0,0.5); font-size: 12px; }
  .insp .ih { font-weight: bold; color: var(--gold); font-size: 13px; margin-bottom: 4px; }
  .insp .irow { color: #c9a7ff; margin: 1px 0; }
  .insp .ibtns { display: flex; gap: 6px; margin-top: 8px; }
  .insp button { flex: 1; border-radius: 7px; padding: 6px 4px; font-size: 11px; font-weight: bold; cursor: pointer;
    border: 1px solid #6b5fa0; background: var(--dark); color: var(--ink); font-family: inherit; }
  .insp button.up { background: var(--good); color: #07321f; border-color: var(--good); }
  .insp button.sell { background: #3a1530; color: #ff9ec9; border-color: #7a3060; }
  .insp button:disabled { opacity: 0.4; cursor: default; }

  .overlay { position: absolute; inset: 0; background: rgba(15,9,30,0.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 22px; z-index: 20; border-radius: 8px; }
  .overlay.hidden { display: none; }
  .overlay h1 { color: var(--gold); font-size: clamp(22px,5vw,32px); margin-bottom: 8px; letter-spacing: 1px; }
  .overlay p { color: #c9a7ff; max-width: 420px; line-height: 1.55; margin-bottom: 8px; font-size: 14px; }
  .overlay .big { color: var(--good); font-size: 18px; font-weight: bold; }
  .overlay button { margin-top: 14px; background: var(--gold); color: #1a0f3d; border: none; border-radius: 999px;
    padding: 11px 26px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .banner { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); text-align: center; z-index: 8;
    pointer-events: none; opacity: 0; transition: opacity 0.4s; }
  .banner.show { opacity: 1; }
  .banner .b1 { color: var(--gold); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .banner .b2 { color: var(--ink); font-size: clamp(18px,4vw,26px); font-weight: 800; text-shadow: 0 2px 6px #000; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <span class="stat gold"><span class="lbl">Gold</span><b id="s-gold">0</b></span>
    <span class="stat lives"><span class="lbl">City</span><b id="s-lives">0</b>♥</span>
    <span class="stat wave"><span class="lbl">Wave</span><b id="s-wave">0</b>/<span id="s-wmax">0</span></span>
    <span class="spacer"></span>
    <span class="stat score"><span class="lbl">Score</span><b id="s-score">0</b></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="660" height="396"></canvas>
    <div class="banner" id="banner"><div class="b1" id="banner1">Dead Drop</div><div class="b2" id="banner2"></div></div>
    <div class="overlay" id="ovl">
      <h1 id="ovl-title">SIEGE ON CHESS CITY</h1>
      <p id="ovl-msg">The CEO is marching his pieces down the Journey road toward Chess City. Build a line of defenders, hold every wave, and protect the gates.</p>
      <p id="ovl-extra" class="big"></p>
      <button id="ovl-btn">Begin the siege</button>
    </div>
  </div>

  <div class="decree-row">
    <span style="font-size:18px">👑</span>
    <div class="decree-meter"><div class="decree-fill" id="decree-fill"></div></div>
    <button class="decree-btn" id="decree-btn">Royal Decree</button>
  </div>

  <div class="shop" id="shop"></div>

  <div class="actions">
    <button class="act primary" id="send-btn">Send next wave</button>
    <button class="act" id="speed-btn">Speed ▶▶ 1×</button>
    <span class="hint" id="hint">Pick a defender, then tap a tile to build. Tap a tower to upgrade or sell.</span>
  </div>
</div>

<script>
(function () {
'use strict';
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 660, H = 396, CELL = 44, COLS = 15, ROWS = 9;

// ---- the Journey road: waypoints in cell (col,row) coordinates ----
var WAY = [[0,4],[3,4],[3,1],[7,1],[7,7],[11,7],[11,4],[14,4]];
function cellCenter(c, r) { return { x: c * CELL + CELL / 2, y: r * CELL + CELL / 2 }; }
var PATH = WAY.map(function (w) { return cellCenter(w[0], w[1]); });

// mark path cells (so they can't be built on)
var blocked = {};
function key(c, r) { return c + ',' + r; }
for (var i = 0; i < WAY.length - 1; i++) {
  var a = WAY[i], b = WAY[i + 1];
  var dc = Math.sign(b[0] - a[0]), dr = Math.sign(b[1] - a[1]);
  var c = a[0], r = a[1];
  blocked[key(c, r)] = true;
  while (c !== b[0] || r !== b[1]) { c += dc; r += dr; blocked[key(c, r)] = true; }
}

// ---- tower catalogue (PJCC defenders) ----
var TOWERS = {
  pawn:   { name: 'Pawn Picket', glyph: '♙', cost: 50,  range: 92,  dmg: 8,  rate: 0.55, splash: 0,  color: '#dfe6ff', lore: 'Checker Town conscripts. Cheap, quick, everywhere.' },
  knight: { name: 'Argus Outpost', glyph: '♘', cost: 110, range: 96, dmg: 13, rate: 1.05, splash: 46, color: '#8fe3ff', lore: "Argus the guard-dog's kennel — hits the whole pack at once." },
  bishop: { name: 'Bishop Spire', glyph: '♗', cost: 130, range: 170, dmg: 27, rate: 1.3,  splash: 0,  color: '#c79bff', lore: 'A long diagonal sightline. Picks off runners from afar.' },
  rook:   { name: 'Rook Bastion', glyph: '♖', cost: 165, range: 124, dmg: 58, rate: 1.85, splash: 0,  color: '#ffb066', lore: 'Castle-wall firepower. Slow, but it flattens tanks.' },
  queen:  { name: "Queen's Guard", glyph: '♕', cost: 285, range: 150, dmg: 30, rate: 0.7,  splash: 42, color: '#ff8fd0', lore: 'The royal escort: fast, far, and splashes. Premium.' }
};
var ORDER = ['pawn', 'knight', 'bishop', 'rook', 'queen'];

// ---- enemy types (the CEO's army) ----
var FOES = {
  pawn:   { glyph: '♟', hp: 32,  spd: 56, reward: 6,  color: '#b9a8e6', leak: 1 },
  bishop: { glyph: '♝', hp: 46,  spd: 82, reward: 9,  color: '#c79bff', leak: 1 },
  knight: { glyph: '♞', hp: 62,  spd: 98, reward: 11, color: '#8fe3ff', leak: 1 },
  rook:   { glyph: '♜', hp: 150, spd: 46, reward: 19, color: '#ffb066', leak: 2 },
  queen:  { glyph: '♛', hp: 320, spd: 56, reward: 42, color: '#ff8fd0', leak: 4 },
  king:   { glyph: '♚', hp: 1700, spd: 40, reward: 300, color: '#F5C518', leak: 12, boss: true }
};

// ---- waves: list of spawn groups ----
function W_(t, n, gap) { return { t: t, n: n, gap: gap }; }
var WAVES = [
  [ W_('pawn', 8, 0.85) ],
  [ W_('pawn', 12, 0.7) ],
  [ W_('pawn', 6, 0.6), W_('bishop', 5, 0.7) ],
  [ W_('bishop', 10, 0.6), W_('knight', 3, 0.8) ],
  [ W_('knight', 10, 0.55), W_('pawn', 8, 0.4) ],
  [ W_('rook', 4, 1.2), W_('bishop', 8, 0.5) ],
  [ W_('knight', 14, 0.45), W_('rook', 3, 1.1) ],
  [ W_('queen', 1, 1), W_('bishop', 12, 0.45) ],
  [ W_('rook', 7, 0.8), W_('knight', 10, 0.45) ],
  [ W_('queen', 2, 2.5), W_('rook', 6, 0.7), W_('knight', 8, 0.4) ],
  [ W_('pawn', 20, 0.3), W_('bishop', 14, 0.3), W_('knight', 10, 0.35) ],
  [ W_('queen', 1, 1), W_('rook', 6, 0.8), W_('king', 1, 1) ]
];

// ---- game state ----
var G = null;
function newGame() {
  return {
    gold: 230, lives: 20, score: 0, kills: 0,
    wave: 0, running: false, over: false, won: false,
    towers: [], foes: [], shots: [], parts: [],
    spawnQ: [], spawnT: 0, betweenT: 0, waveActive: false,
    decree: 0, decreeMax: 100, speed: 1, sel: null
  };
}

// ---------- spawning ----------
function buildSpawnQueue(waveIdx) {
  var q = [], delay = 0;
  WAVES[waveIdx].forEach(function (grp) {
    for (var k = 0; k < grp.n; k++) { q.push({ t: grp.t, at: delay }); delay += grp.gap; }
  });
  return q;
}
function startWave() {
  if (G.waveActive || G.over) return;
  if (G.wave >= WAVES.length) return;
  G.spawnQ = buildSpawnQueue(G.wave);
  G.spawnT = 0; G.waveActive = true; G.betweenT = 0;
  var foeName = WAVES[G.wave].map(function (g) { return g.t; });
  var hasKing = foeName.indexOf('king') >= 0;
  showBanner(hasKing ? 'Final Intercept' : 'Dead Drop — Wave ' + (G.wave + 1),
    hasKing ? 'The CEO himself approaches' : describeWave(G.wave));
}
function describeWave(idx) {
  var counts = {};
  WAVES[idx].forEach(function (g) { counts[g.t] = (counts[g.t] || 0) + g.n; });
  return Object.keys(counts).map(function (t) { return counts[t] + ' ' + t + (counts[t] > 1 ? 's' : ''); }).join(' · ');
}
function spawnFoe(typeName) {
  var base = FOES[typeName];
  var scale = 1 + G.wave * 0.16;
  var hp = Math.round(base.hp * (base.boss ? 1 : scale));
  G.foes.push({
    type: typeName, glyph: base.glyph, color: base.color, boss: !!base.boss,
    hp: hp, maxhp: hp, spd: base.spd, reward: base.reward, leak: base.leak,
    seg: 0, t: 0, x: PATH[0].x, y: PATH[0].y, slow: 0
  });
}

// ---------- movement ----------
function advanceFoe(f, dt) {
  if (f.seg >= PATH.length - 1) return;
  var a = PATH[f.seg], b = PATH[f.seg + 1];
  var segLen = Math.hypot(b.x - a.x, b.y - a.y);
  var sp = f.spd * (f.slow > 0 ? 0.5 : 1);
  f.t += (sp * dt) / segLen;
  while (f.t >= 1 && f.seg < PATH.length - 1) {
    f.t -= 1; f.seg++;
    if (f.seg >= PATH.length - 1) { f.t = 1; break; }
    a = PATH[f.seg]; b = PATH[f.seg + 1];
    segLen = Math.hypot(b.x - a.x, b.y - a.y);
  }
  a = PATH[f.seg]; b = PATH[Math.min(f.seg + 1, PATH.length - 1)];
  f.x = a.x + (b.x - a.x) * f.t;
  f.y = a.y + (b.y - a.y) * f.t;
  if (f.slow > 0) f.slow -= dt;
}

// ---------- combat ----------
function towerStats(tw) {
  var base = TOWERS[tw.kind];
  var mult = 1 + (tw.lvl - 1) * 0.6;
  return { dmg: base.dmg * mult, range: base.range * (1 + (tw.lvl - 1) * 0.12), rate: base.rate, splash: base.splash };
}
function fireTowers(dt) {
  G.towers.forEach(function (tw) {
    tw.cd -= dt;
    if (tw.cd > 0) return;
    var s = towerStats(tw);
    var target = null, bestProg = -1;
    for (var i = 0; i < G.foes.length; i++) {
      var f = G.foes[i];
      if (Math.hypot(f.x - tw.x, f.y - tw.y) <= s.range) {
        var prog = f.seg + f.t;                 // target the foe furthest along
        if (prog > bestProg) { bestProg = prog; target = f; }
      }
    }
    if (!target) return;
    tw.cd = s.rate;
    G.shots.push({ x: tw.x, y: tw.y, tx: target.x, ty: target.y, target: target,
      dmg: s.dmg, splash: s.splash, kind: tw.kind, life: 0, color: TOWERS[tw.kind].color });
  });
}
function updateShots(dt) {
  for (var i = G.shots.length - 1; i >= 0; i--) {
    var s = G.shots[i];
    s.life += dt;
    var tx = s.target && s.target.hp > 0 ? s.target.x : s.tx;
    var ty = s.target && s.target.hp > 0 ? s.target.y : s.ty;
    var d = Math.hypot(tx - s.x, ty - s.y);
    var step = 460 * dt;
    if (d <= step || s.life > 1.2) {
      hit(tx, ty, s);
      G.shots.splice(i, 1);
    } else {
      s.x += (tx - s.x) / d * step; s.y += (ty - s.y) / d * step;
    }
  }
}
function hit(x, y, s) {
  burst(x, y, s.color, s.splash ? 10 : 5);
  if (s.splash) {
    G.foes.forEach(function (f) { if (Math.hypot(f.x - x, f.y - y) <= s.splash) damage(f, s.dmg); });
  } else if (s.target && s.target.hp > 0) {
    damage(s.target, s.dmg);
  } else {
    // nearest foe to impact point
    var best = null, bd = 22;
    G.foes.forEach(function (f) { var dd = Math.hypot(f.x - x, f.y - y); if (dd < bd) { bd = dd; best = f; } });
    if (best) damage(best, s.dmg);
  }
}
function damage(f, dmg) {
  if (f.hp <= 0) return;
  f.hp -= dmg;
  if (f.hp <= 0) {
    f.hp = 0;
    G.gold += f.reward; G.kills++; G.score += f.boss ? 200 : 10;
    chargeDecree(f.reward);
    burst(f.x, f.y, f.color, f.boss ? 40 : 14);
  }
}

// ---------- royal decree ----------
function chargeDecree(amt) { G.decree = Math.min(G.decreeMax, G.decree + amt * 0.5); refreshDecree(); }
function fireDecree() {
  if (G.decree < G.decreeMax || G.over) return;
  G.decree = 0; refreshDecree();
  G.foes.forEach(function (f) { damage(f, 130); });
  decreeFlash = 0.6;
  for (var i = 0; i < 60; i++) {
    var an = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
    G.parts.push({ x: W / 2, y: H / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 0.9, max: 0.9, c: Math.random() < 0.5 ? '#ff8fd0' : '#F5C518', r: 3 });
  }
  showBanner('Royal Decree', 'Princess raises the banner of Checker Town');
}

// ---------- particles ----------
function burst(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var an = Math.random() * Math.PI * 2, sp = 25 + Math.random() * 95;
    G.parts.push({ x: x, y: y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 0.45, max: 0.45, c: color, r: 1 + Math.random() * 2 });
  }
}
function updateParts(dt) {
  for (var i = G.parts.length - 1; i >= 0; i--) {
    var p = G.parts[i]; p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
  }
}

// ---------- main update ----------
var decreeFlash = 0;
function update(dt) {
  if (!G.running || G.over) return;

  // spawning
  if (G.waveActive) {
    G.spawnT += dt;
    while (G.spawnQ.length && G.spawnQ[0].at <= G.spawnT) {
      spawnFoe(G.spawnQ.shift().t);
    }
    if (!G.spawnQ.length && !G.foes.length) {
      // wave cleared
      G.waveActive = false;
      G.wave++;
      G.score += 100;
      if (G.wave >= WAVES.length) { return endGame(true); }
      G.gold += 40 + G.wave * 5;            // clear bonus
      G.betweenT = 0;
    }
  } else if (!G.over) {
    G.betweenT += dt;
    if (G.betweenT >= 8) startWave();        // auto-start next wave
  }

  G.foes.forEach(function (f) { advanceFoe(f, dt); });
  // leaks
  for (var i = G.foes.length - 1; i >= 0; i--) {
    var f = G.foes[i];
    if (f.seg >= PATH.length - 1 && f.t >= 1) {
      G.lives -= f.leak; G.foes.splice(i, 1);
      burst(PATH[PATH.length - 1].x, PATH[PATH.length - 1].y, '#ff6b6b', 12);
      if (G.lives <= 0) { G.lives = 0; return endGame(false); }
    }
  }
  // remove dead
  for (var j = G.foes.length - 1; j >= 0; j--) { if (G.foes[j].hp <= 0) G.foes.splice(j, 1); }

  fireTowers(dt);
  updateShots(dt);
  updateParts(dt);
  if (decreeFlash > 0) decreeFlash -= dt;
  syncHud();
}

// ---------- rendering ----------
function draw() {
  ctx.clearRect(0, 0, W, H);
  // grass / map background
  var grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#1c1142'); grd.addColorStop(1, '#150b30');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  // buildable grid dots
  ctx.fillStyle = 'rgba(122,104,192,0.18)';
  for (var c = 0; c < COLS; c++) for (var r = 0; r < ROWS; r++) {
    if (blocked[key(c, r)]) continue;
    ctx.fillRect(c * CELL + CELL / 2 - 1, r * CELL + CELL / 2 - 1, 2, 2);
  }

  // the road
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#3a2a5e'; ctx.lineWidth = CELL - 6;
  roadPath(); ctx.stroke();
  ctx.strokeStyle = '#4a3770'; ctx.lineWidth = CELL - 16;
  roadPath(); ctx.stroke();
  // dashed centre
  ctx.setLineDash([7, 10]); ctx.strokeStyle = 'rgba(245,197,24,0.35)'; ctx.lineWidth = 2;
  roadPath(); ctx.stroke(); ctx.setLineDash([]);

  // start flag + Chess City gate
  var st = PATH[0], en = PATH[PATH.length - 1];
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🚩', st.x + 4, st.y);
  drawCity(en.x, en.y);

  // selection range preview
  if (G.sel && hoverCell && !blocked[key(hoverCell.c, hoverCell.r)] && !towerAt(hoverCell.c, hoverCell.r)) {
    var ctr = cellCenter(hoverCell.c, hoverCell.r);
    var afford = G.gold >= TOWERS[G.sel].cost;
    ctx.fillStyle = afford ? 'rgba(107,255,184,0.10)' : 'rgba(255,107,107,0.12)';
    ctx.beginPath(); ctx.arc(ctr.x, ctr.y, TOWERS[G.sel].range, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = afford ? 'rgba(107,255,184,0.22)' : 'rgba(255,107,107,0.25)';
    ctx.fillRect(hoverCell.c * CELL + 3, hoverCell.r * CELL + 3, CELL - 6, CELL - 6);
  }

  // towers
  G.towers.forEach(function (tw) {
    var base = TOWERS[tw.kind];
    if (tw === selTower) {
      var s = towerStats(tw);
      ctx.fillStyle = 'rgba(245,197,24,0.10)';
      ctx.beginPath(); ctx.arc(tw.x, tw.y, s.range, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#241544'; roundRect(tw.x - 17, tw.y - 17, 34, 34, 7); ctx.fill();
    ctx.strokeStyle = base.color; ctx.lineWidth = 2; roundRect(tw.x - 17, tw.y - 17, 34, 34, 7); ctx.stroke();
    ctx.font = '24px serif'; ctx.fillStyle = base.color;
    ctx.fillText(base.glyph, tw.x, tw.y + 1);
    // level pips
    for (var L = 0; L < tw.lvl; L++) { ctx.fillStyle = '#F5C518'; ctx.beginPath(); ctx.arc(tw.x - 10 + L * 9, tw.y + 14, 2.2, 0, 7); ctx.fill(); }
  });

  // foes
  G.foes.forEach(function (f) {
    var rad = f.boss ? 19 : 13;
    ctx.font = (f.boss ? 30 : 22) + 'px serif'; ctx.fillStyle = f.color;
    if (f.slow > 0) { ctx.globalAlpha = 0.75; }
    ctx.fillText(f.glyph, f.x, f.y + 1); ctx.globalAlpha = 1;
    // hp bar
    var w = f.boss ? 40 : 24, pct = f.hp / f.maxhp;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(f.x - w / 2, f.y - rad - 7, w, 4);
    ctx.fillStyle = pct > 0.5 ? '#6bffb8' : pct > 0.25 ? '#F5C518' : '#ff6b6b';
    ctx.fillRect(f.x - w / 2, f.y - rad - 7, w * pct, 4);
  });

  // shots
  G.shots.forEach(function (s) {
    ctx.strokeStyle = s.color; ctx.lineWidth = s.splash ? 3 : 2; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - (s.tx - s.x) * 0.06, s.y - (s.ty - s.y) * 0.06); ctx.stroke();
    ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, s.splash ? 4 : 2.6, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  });

  // particles
  G.parts.forEach(function (p) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (decreeFlash > 0) {
    ctx.fillStyle = 'rgba(255,143,208,' + (decreeFlash * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function roadPath() {
  ctx.beginPath(); ctx.moveTo(PATH[0].x, PATH[0].y);
  for (var i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
}
function drawCity(x, y) {
  ctx.fillStyle = '#2a1a5e'; roundRect(x - 6, y - 22, 40, 44, 5); ctx.fill();
  ctx.strokeStyle = '#F5C518'; ctx.lineWidth = 2; roundRect(x - 6, y - 22, 40, 44, 5); ctx.stroke();
  ctx.font = '24px serif'; ctx.fillStyle = '#F5C518'; ctx.textAlign = 'center';
  ctx.fillText('🏰', x + 14, y);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- input ----------
var hoverCell = null, selTower = null;
function evtCell(e) {
  var rect = cv.getBoundingClientRect();
  var px = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width * W;
  var py = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / rect.height * H;
  return { c: Math.floor(px / CELL), r: Math.floor(py / CELL), px: px, py: py };
}
function towerAt(c, r) {
  for (var i = 0; i < G.towers.length; i++) if (G.towers[i].c === c && G.towers[i].r === r) return G.towers[i];
  return null;
}
cv.addEventListener('mousemove', function (e) { hoverCell = evtCell(e); });
cv.addEventListener('mouseleave', function () { hoverCell = null; });
cv.addEventListener('click', function (e) {
  if (!G.running || G.over) return;
  var cell = evtCell(e);
  if (cell.c < 0 || cell.c >= COLS || cell.r < 0 || cell.r >= ROWS) return;
  var existing = towerAt(cell.c, cell.r);
  if (existing) { openInspector(existing, cell); return; }
  closeInspector();
  if (blocked[key(cell.c, cell.r)]) { setHint('Can’t build on the road.'); return; }
  if (!G.sel) { setHint('Pick a defender below first.'); return; }
  var def = TOWERS[G.sel];
  if (G.gold < def.cost) { setHint('Not enough gold for ' + def.name + '.'); return; }
  var ctr = cellCenter(cell.c, cell.r);
  G.gold -= def.cost;
  G.towers.push({ kind: G.sel, c: cell.c, r: cell.r, x: ctr.x, y: ctr.y, lvl: 1, cd: 0, invested: def.cost });
  syncHud(); buildShop();
  setHint(def.name + ' deployed. ' + def.lore);
});

// ---------- tower inspector ----------
var inspEl = null;
function closeInspector() { selTower = null; if (inspEl) { inspEl.remove(); inspEl = null; } }
function openInspector(tw, cell) {
  closeInspector(); selTower = tw;
  var base = TOWERS[tw.kind], s = towerStats(tw);
  var upCost = Math.round(base.cost * 0.85 * tw.lvl);
  var sellVal = Math.round(tw.invested * 0.6);
  var stage = document.getElementById('stage');
  inspEl = document.createElement('div'); inspEl.className = 'insp';
  inspEl.innerHTML =
    '<div class="ih">' + base.glyph + ' ' + base.name + ' · L' + tw.lvl + '</div>' +
    '<div class="irow">Damage: ' + s.dmg.toFixed(0) + (base.splash ? ' (splash)' : '') + '</div>' +
    '<div class="irow">Range: ' + s.range.toFixed(0) + ' · Rate: ' + base.rate + 's</div>' +
    '<div class="ibtns">' +
      '<button class="up" id="i-up"' + (tw.lvl >= 3 || G.gold < upCost ? ' disabled' : '') + '>' +
        (tw.lvl >= 3 ? 'Max' : 'Upgrade ' + upCost) + '</button>' +
      '<button class="sell" id="i-sell">Sell ' + sellVal + '</button>' +
    '</div>';
  // position near cell, kept on-canvas
  var rect = cv.getBoundingClientRect();
  var scale = rect.width / W;
  var left = Math.min(cell.c * CELL * scale, rect.width - 168);
  var top = Math.min((cell.r + 1) * CELL * scale + 4, rect.height - 120);
  inspEl.style.left = Math.max(2, left) + 'px';
  inspEl.style.top = Math.max(2, top) + 'px';
  stage.appendChild(inspEl);
  document.getElementById('i-up').onclick = function () {
    if (tw.lvl >= 3 || G.gold < upCost) return;
    G.gold -= upCost; tw.lvl++; tw.invested += upCost;
    syncHud(); buildShop(); openInspector(tw, cell);
  };
  document.getElementById('i-sell').onclick = function () {
    G.gold += sellVal;
    G.towers = G.towers.filter(function (t) { return t !== tw; });
    closeInspector(); syncHud(); buildShop();
  };
}

// ---------- HUD / shop ----------
function syncHud() {
  document.getElementById('s-gold').textContent = G.gold;
  document.getElementById('s-lives').textContent = G.lives;
  document.getElementById('s-wave').textContent = Math.min(G.wave + (G.waveActive ? 1 : 0), WAVES.length);
  document.getElementById('s-score').textContent = G.score;
}
function refreshDecree() {
  var pct = G.decree / G.decreeMax * 100;
  document.getElementById('decree-fill').style.width = pct + '%';
  var btn = document.getElementById('decree-btn');
  if (G.decree >= G.decreeMax) { btn.classList.add('ready'); btn.textContent = 'Royal Decree ✦'; }
  else { btn.classList.remove('ready'); btn.textContent = 'Royal Decree'; }
}
function buildShop() {
  var shop = document.getElementById('shop'); shop.innerHTML = '';
  ORDER.forEach(function (kind) {
    var d = TOWERS[kind];
    var el = document.createElement('div');
    el.className = 'twr' + (G.sel === kind ? ' sel' : '') + (G && G.gold < d.cost ? ' cant' : '');
    el.innerHTML = '<div class="g">' + d.glyph + '</div><div class="nm">' + d.name + '</div><div class="ct">' + d.cost + 'g</div>';
    el.onclick = function () { G.sel = (G.sel === kind ? null : kind); closeInspector(); buildShop(); if (G.sel) setHint(d.name + ' — ' + d.lore); };
    el.title = d.lore;
    shop.appendChild(el);
  });
}
function setHint(t) { document.getElementById('hint').textContent = t; }

var bannerT = 0;
function showBanner(b1, b2) {
  document.getElementById('banner1').textContent = b1;
  document.getElementById('banner2').textContent = b2;
  document.getElementById('banner').classList.add('show');
  bannerT = 2.4;
}

// ---------- end ----------
function endGame(won) {
  if (G.over) return;
  G.over = true; G.won = won; G.running = false;
  // leftover gold + survival into score
  G.score += G.lives * 15 + (won ? 600 : 0);
  var credits = Math.min(5, 1 + Math.floor(G.wave / 3) + (won ? 1 : 0));
  if (window.PJCC && PJCC.saveScore) {
    PJCC.saveScore('tower-defense', G.score, { credits: credits, data: { waves: G.wave, kills: G.kills, won: won } });
  }
  var ovl = document.getElementById('ovl');
  document.getElementById('ovl-title').textContent = won ? 'CHESS CITY HOLDS! 🏰' : 'THE GATES HAVE FALLEN';
  document.getElementById('ovl-msg').textContent = won
    ? 'You turned back the CEO and his King. Checker Town sleeps safe tonight — the Journey continues.'
    : 'The CEO’s pieces overran the line at wave ' + (G.wave + 1) + '. Reinforce earlier and hold the chokepoints.';
  document.getElementById('ovl-extra').textContent =
    'Score ' + G.score + ' · ' + G.kills + ' pieces felled · +' + credits + ' credits';
  document.getElementById('ovl-btn').textContent = 'Play again';
  ovl.classList.remove('hidden');
  closeInspector();
}

// ---------- controls ----------
document.getElementById('decree-btn').onclick = fireDecree;
document.getElementById('send-btn').onclick = function () {
  if (!G.running || G.over) return;
  if (G.waveActive) { setHint('Wave already in progress.'); return; }
  G.gold += 25;                  // early-call bonus
  setHint('Early call! +25 gold. Brace yourself.');
  startWave(); syncHud();
};
document.getElementById('speed-btn').onclick = function () {
  G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1;
  this.textContent = 'Speed ▶▶ ' + G.speed + '×';
};
document.getElementById('ovl-btn').onclick = function () {
  document.getElementById('ovl').classList.add('hidden');
  G = newGame(); G.running = true;
  buildShop(); syncHud(); refreshDecree();
  setHint('Pick a defender, then tap a tile to build.');
};

// ---------- loop ----------
var last = 0;
function loop(ts) {
  var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0; last = ts;
  if (G && G.running && !G.over) for (var s = 0; s < G.speed; s++) update(dt);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) document.getElementById('banner').classList.remove('show'); }
  if (G) draw();
  requestAnimationFrame(loop);
}

document.getElementById('s-wmax').textContent = WAVES.length;
G = newGame();
buildShop(); syncHud(); refreshDecree();
requestAnimationFrame(loop);
})();
</script>
