# Site settings
#
# ── THESE TWO LINES ARE WHAT A STRANGER SEES IN A SEARCH RESULT (2026-08-04) ──────────
# `title` is the tab suffix on every page that doesn't set its own `tab_title` — about 145
# of the 147 URLs in sitemap.xml. It read "PJCC" until today, so someone who found /games/
# or /academy/ through Google got a tab, a bookmark and a result naming a thing they had
# never heard of. The site is ChessWild.com. (Nate's call, same day he named the front door:
# "the address IS the brand, the way chess.com's is.")
#
# `description` is the meta description on every page that doesn't set its own — 139 of 147,
# because only 8 pages carry one. It is the SENTENCE GOOGLE PRINTS UNDER THE LINK, and it
# used to open with the animated series and reach "free arcade of chess games" at word 14.
# It now leads with what the site is and answers "is it free / do I need an account" in the
# result itself, before anyone clicks. 123 characters, so nothing gets truncated.
#
# ⚠ NEITHER LINE REACHES AS FAR AS IT LOOKS. `site.title` is referenced in exactly two
# places, both in _includes/head.html (the <title> suffix, and an og:title fallback for a
# page with no title at all). The PWA does NOT read it — manifest.json spells "ChessWild"
# itself. `og:site_name` does not read it either; that is hardcoded "McPuppy Studios", which
# is correct and deliberate: the studio is the publisher, the site is ChessWild. The JSON-LD
# WebSite name is its own hardcoded string in head.html and had to be changed BY HAND to
# match this — if you ever rename the site again, that block is the third place to edit.
# The 8 pages with their own `description:` (index, pjcc, projects, collection, style,
# chess, puzzle-reports, shogi-gate) are unaffected — /pjcc/ in particular keeps its own,
# so the world page still introduces itself as the world.
title: ChessWild.com
description: Free chess for everyone — play a real game, solve a puzzle, or learn from scratch. No account needed. From McPuppy Studios.
image: /assets/images/pjcc-share-card.jpg   # default social/share card (1200×630)
baseurl: ""        # leave empty for root
url: "https://chesswild.com"
permalink: /:year/:month/:day/:title/

# SEO plumbing: sitemap.xml for Google Search Console (+ make seo-tag explicit —
# the game layout already calls {% seo %}). Pages flagged `sitemap: false` stay out.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Ship MINIFIED CSS. Jekyll compiles assets/css/style.scss on every build; by default
# it emits the expanded, fully-commented stylesheet (~140 KB of source). `compressed`
# strips comments and whitespace on the way out — the source stays readable, only the
# served file shrinks. Free win, no code changes.
sass:
  style: compressed

# ── Support / funding links ──────────────────────────────────────────────
# Single source of truth for the whole site. The splash Patreon quad and the
# Direct Line read these values.
# While a value is empty, every spot shows its graceful "coming soon" /
# "opening soon" state and nothing 404s. The moment your page is live, paste
# the URL here (one line) and every link across the site lights up at once.
patreon_url: "https://patreon.com/mcpuppystudios"   # live
kofi_url:    ""   # optional one-off tip jar, e.g. "https://ko-fi.com/mcpuppystudios"

# ── Slow-roll: characters/locations kept built but hidden from user-facing ────────
# The files stay intact (everything we've built is preserved); these are just left
# OFF the cast grid, the locations map, and the homepage counters until we reveal
# them. To bring one back, delete its line here. (Cross-references from other pages
# are handled separately.)
hidden_character_urls:
  - /characters/robert/
  - /characters/prodigal-brothers/
  - /characters/commentators/
  - /characters/kaede/
  - /characters/matsu/
  - /characters/murphy/
hidden_location_urls:
  - /locations/the-sea/
  - /locations/mystery-city/
  - /locations/chess-city-elementary/

# ── The cast are all PAWNS until the series promotes them ─────────────────────────
# Every character still carries the piece they will EVENTUALLY be in their own front
# matter (`piece:` — Princess ♞, Auston ♜, and so on); nothing there was changed. The
# CARDS just show a pawn, because in this world you are promoted on screen, not in a
# config file. Add a character's URL here when the series has earned them their piece.
promoted_character_urls: []

# Navigation
header_pages:
  - index.md
  - projects.md
  - blog.md
  - characters.md
  - locations.md
  - games.md
  - leaderboards.md
  - dossier.md
  - mailing-list.md
  - In-Person Chess Lessons.md
  - contact.md






defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      body_class: theme-bw
  # keep raw asset files (game HTML, vendor, videos, images) OUT of sitemap.xml —
  # the wrapper pages are the canonical URLs
  - scope:
      path: "assets"
    values:
      sitemap: false
  # internal working files — not part of the site (they stay in the repo/GitHub)
  # ⚠ THESE TWO ENTRIES DID NOT DO WHAT THEY SAY. Kept because `sitemap: false` here is
  # what held the docs out of sitemap.xml, and because they still apply to any file in
  # those folders that DOES carry front matter. But `published: false` never reached the
  # ones that don't — see the `exclude:` block below, which is the mechanism that works.
  - scope:
      path: "docs"
    values:
      published: false
      sitemap: false
  - scope:
      path: "tests"
    values:
      published: false
      sitemap: false

# ══ WHAT NEVER LEAVES THE REPO (2026-08-12) ═══════════════════════════════════════
# Nate: "If this is going to explode like I believe it will, we should probably protect
# the guts of it." The guts were more exposed than either of us thought, and NOT because
# the repo is public — because the build was SHIPPING them.
#
# ⚠⚠ `published: false` DOES NOT APPLY TO A FILE WITH NO FRONT MATTER. That is the whole
# bug, and the intent above was already correct: somebody wrote "internal working files —
# not part of the site" and meant it. But a file kramdown sees no front matter on is a
# STATIC FILE, and `defaults` never reach static files — Jekyll copies them verbatim. So
# all 19 docs/ files answered 200 on the live domain, including supabase-setup.sql and
# username-moderation-setup.sql, plus all 40 tests/ files, package.json and README.md.
# A guard that reads correctly and does nothing, which is this repo's recurring shape.
# (They were never in sitemap.xml, so Google was not handed them — the `sitemap: false`
# half of that rule DID work. Reachable, not advertised.)
#
# ⚠ SETTING `exclude` REPLACES JEKYLL'S DEFAULT LIST rather than adding to it, so the
# defaults are re-listed here. Drop them and Gemfile/vendor start publishing instead —
# a fix that quietly opens a second door, which is exactly how the last one worked.
# node_modules/ is not tracked by git so it was never in the build, but it stays listed:
# the reason it is safe today is a .gitignore line, not this file.
#
# ⭐ NOT A SECURITY BOUNDARY, and should not be mistaken for one. Everything under
# assets/js is still served to every visitor — that is what makes the site run, and no
# config hides it. This closes the gap between what the site MEANS to publish and what it
# actually publishes. The DB schema being private is tidiness; what protects the data is
# Supabase RLS. The only key in the repo is the anon key, which is public by design.
exclude:
  # Jekyll's defaults, restored because naming this key discards them
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # the working material — ⚠ assets/vendor/ is NOT this and must keep shipping
  - docs/
  - tests/
  - .githooks/
  - package.json
  - package-lock.json
  - README.md
  - FUTURE-IDEAS.md
  - CLAUDE.md

collections:
  characters:
    output: true
    permalink: /characters/:name/
  locations:
    output: true
    permalink: /locations/:name/
  tag_pages:
    output: true
    permalink: /tags/:name/
  evolutions:
    output: true
    permalink: /evolutions/:name/
# ══ SOCIAL ACCOUNTS ═══════════════════════════════════════════════════════════════
# All six are RESERVED (Nate, 2026-08-10). Reserved is not the same as ready, so each one
# carries its own switch:
#
#   live: true   → renders as a link in the site footer
#   live: false  → renders nowhere a visitor can see
#
# ⚠ WHY THE SWITCH EXISTS. A footer row of links to six empty profiles reads as an
# abandoned project, which is the opposite of what linking them is for — and it is the
# "unready things get a plain note, or they don't ship" rule. Flip one to true the day it
# has something on it; nothing else has to change, and nothing has to be rebuilt.
#
# ⭐ THE JSON-LD IS DIFFERENT, DELIBERATELY. `sameAs` in _includes/head.html lists every
# account, live or not: that is an identity claim to a search engine — "these handles are
# this same organization" — which is the whole reason for reserving a handle early. It is
# not a promotion, and no visitor ever reads it.
socials:
  - name: Instagram
    handle: "chessWild_official"
    url: "https://instagram.com/chessWild_official"
    live: false
  - name: TikTok
    handle: "chessWild.com"
    url: "https://tiktok.com/@chessWild.com"
    live: false
  - name: YouTube
    handle: "ChessWild_Official"
    url: "https://youtube.com/@ChessWild_Official"
    live: false
  - name: X
    handle: "@real_ChessWild"
    url: "https://x.com/real_ChessWild"
    live: false
  - name: Reddit
    handle: "u/chesswild_official"
    url: "https://reddit.com/user/chesswild_official"
    live: false
  - name: Pinterest
    handle: "chesswild_official"
    url: "https://pinterest.com/chesswild_official"
    live: false
