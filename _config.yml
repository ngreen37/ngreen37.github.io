# Site settings
title: PJCC
description: Website For Princess and the Journey to Chess City
image: /assets/images/pjcc-share-card.png   # default social/share card (1200×630)
baseurl: ""        # leave empty for root
url: "https://mcpuppystudios.com"
permalink: /:year/:month/:day/:title/

# ── Support / funding links ──────────────────────────────────────────────
# Single source of truth for the whole site. The splash Patreon quad, the
# Press Pass support buttons, and the Direct Line all read these values.
# While a value is empty, every spot shows its graceful "coming soon" /
# "opening soon" state and nothing 404s. The moment your page is live, paste
# the URL here (one line) and every link across the site lights up at once.
patreon_url: "https://patreon.com/mcpuppystudios"   # live
kofi_url:    ""   # optional one-off tip jar, e.g. "https://ko-fi.com/mcpuppystudios"

# Navigation
header_pages:
  - index.md
  - projects.md
  - blog.md
  - characters.md
  - locations.md
  - games.md
  - leaderboards.md
  - dossier.md
  - mailing-list.md
  - In-Person Chess Lessons.md
  - contact.md






defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      body_class: theme-bw

collections:
  characters:
    output: true
    permalink: /characters/:name/
  locations:
    output: true
    permalink: /locations/:name/
  tag_pages:
    output: true
    permalink: /tags/:name/
  evolutions:
    output: true
    permalink: /evolutions/:name/
# Optional: social links / footer
# (you can add later if you want)
# github: yourusernames
# twitter: yourhandle
