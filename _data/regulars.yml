# ══════════════════════════════════════════════════════════════════════════════════════
# THE PARK TABLES REGULARS — the bench, as DATA
#
# ⚠ THIS FILE IS NOT THE SOURCE OF TRUTH. `BOTS` in games/park-tables/index.html is. This
# exists so a Jekyll page can SAY something about the bench without a third hand-typed copy
# of it appearing on the site — the front door prints the number of open seats from here.
#
# ⚠ IT IS GATED. `npm run test:regulars` reads the real BOTS object out of the Park Tables
# page and fails if these rows disagree with it on name, rating, or which seats are locked.
# So this cannot silently drift; it can only be wrong loudly. Change the bench, run the gate,
# and it will tell you exactly which row to fix.
#
# `open: false` = the seat is rendered but locked behind beating somebody first. A locked
# seat you can see is a reason to keep playing.
#
# ⚑ `icon:` ADDED 2026-08-18, when the front door started drawing the bench instead of just
# counting it. It is copied from BOTS like every other field here and the gate covers it, so
# it cannot drift silently — but it is still a copy, and the rule above applies: fix the YAML,
# never the game.
# ⚠ THE OPPOSITE-COLOR TWINS ARE NOT THE SAME PICTURE, AND THE NOTE THAT SAT HERE SAYING SO
# WAS WRONG (corrected 2026-08-19, off a render). It claimed ♖/♜, ♗/♝, ♕/♛ and ♙/♟ read
# identically at card size and that only ♔ and ♘ were safe next to ♚ and ♞ — which left eight
# usable faces for nine seats. All twelve were drawn at the bench's real 1.15rem in the front
# door's own color and font: WHITE COMES OUT AS AN OUTLINE, BLACK AS A SOLID, and every pair
# reads apart, the rook pair most plainly of all. The same render picked Nate's ♙ over in BOTS;
# the reasoning is written out there and it is the one to read before changing a face here.
# ⭐ STILL PICK TWINS THAT SIT FAR APART ON THE LADDER. The old claim may hold on a platform
# that reaches for a color-emoji font, so the pairs are kept defensive: ♙ (Nate, 1200) against
# ♟ (Princess, 2100), ♖ (Maxwell, 400) against ♜ (Robert, 1800).
#
# ⚑ PRINCESS WEARS A PAWN, NOT A QUEEN (2026-08-19, Nate: "Make it a pawn - she'll graduate
# later."). Her seat had worn ♛ since the ladder was built — four weeks after he had the queen
# arc pulled off the public site on 07-16 (the trait line, the Ascension section and the
# /characters/the-queen/ page all came out that day). `_includes/char-card-piece.html` draws
# every cast card as ♟ for exactly this reason, "in this world you get promoted on screen, not
# in a config file" — and this bench was the last place still saying the ending out loud.
# Maxwell moved to ♖ so the pawn was free; his old ♟ is the glyph she wears now.
# ⚠ `npm run test:regulars` FAILS if a queen glyph ever comes back to her seat.
