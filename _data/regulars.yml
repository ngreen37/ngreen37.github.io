# block under the ladder in the game, and the front door prints "Adapts" where her rating
# would go. `elo: 1200` is kept ONLY because the gate compares this file field-for-field
# against BOTS, where 1200 survives as the dial's invisible SEED — it is not a claim about
# her strength and nothing renders it.
# ⚠ THE ORDER OF THIS FILE IS CHECKED. She must stay last here for as long as she is last
