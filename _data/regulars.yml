# ══════════════════════════════════════════════════════════════════════════════════════
# THE PARK TABLES REGULARS — the bench, as DATA
#
# ⚠ THIS FILE IS NOT THE SOURCE OF TRUTH. `BOTS` in games/park-tables/index.html is. This
# exists so a Jekyll page can SAY something about the bench without a third hand-typed copy
# of it appearing on the site — the front door prints the number of open seats from here.
#
# ⚠ IT IS GATED. `npm run test:regulars` reads the real BOTS object out of the Park Tables
# page and fails if these rows disagree with it on name, rating, or which seats are locked.
# So this cannot silently drift; it can only be wrong loudly. Change the bench, run the gate,
# and it will tell you exactly which row to fix.
#
# `open: false` = the seat is rendered but locked behind beating somebody first. A locked
# seat you can see is a reason to keep playing.
#
# ⚑ `icon:` ADDED 2026-08-18, when the front door started drawing the bench instead of just
# counting it. It is copied from BOTS like every other field here and the gate covers it, so
# it cannot drift silently — but it is still a copy, and the rule above applies: fix the YAML,
# never the game.
# ⚠ THE GLYPHS ARE NOT INTERCHANGEABLE WITH THEIR OPPOSITE-COLOR TWINS. Rendered at card size,
# ♖/♜, ♗/♝, ♕/♛ and ♙/♟ are the SAME PICTURE — only ♔ (crown with a cross) and ♘ (an outline
# horse) read as different from ♚ and ♞. That is why The CEO wears ♔ next to The Dad's ♚ and
# Auston wears ♘ next to Crockett's ♞, and why swapping one for "the white version" of a
# glyph already in use would quietly give two regulars the same face.
# ══════════════════════════════════════════════════════════════════════════════════════

