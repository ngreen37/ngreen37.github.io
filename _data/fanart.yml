# PJCC Fan Wall — powers the gallery on /fan-art/.
#
# To hang a piece on the wall:
#   1. Save the image into  /assets/images/fan-art/  (create that folder if it
#      doesn't exist yet).
#   2. Add an entry below (newest first) and delete the leading "# ".
#
# While every entry is commented out, the wall shows its friendly "be the first"
# empty state — so nothing looks broken before the first piece goes up.
#
# IMPORTANT: every submission is SCREENED first — nothing goes on the wall (or
# into the games' lobby galleries) unless it's added here by hand. Each hung
# piece shows a "✓ SCREENED · HUNG BY McPUPPY" stamp; add `hung:` for the date.
#
# Example (save the image to the path, then uncomment these four lines):
#
# - img: /assets/images/fan-art/my-picture.png
#   title: "Princess"
#   by: "a fan"
#   hung: 2026-07-08
