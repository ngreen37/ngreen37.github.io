<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0714">
  <title>Signal lost — P&JCC</title>
  <!-- Fully self-contained: no external CSS/fonts, so this renders with zero network.
       Served by the service worker (sw.js) when a page can't be reached offline. -->
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(120% 90% at 50% 12%, #2a1a5e 0%, #160c33 48%, #0a0714 100%);
      color: #efe9ff;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 460px; }
    .crown { width: 96px; height: 96px; margin: 0 auto 22px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
    .tag {
      display: inline-block; letter-spacing: .28em; text-transform: uppercase;
      font-size: .72rem; font-weight: 700; color: #F5C518;
      border: 1px solid rgba(245,197,24,.5); border-radius: 999px; padding: 5px 14px; margin-bottom: 18px;
    }
    h1 { font-size: 1.5rem; line-height: 1.2; margin-bottom: 12px; color: #fff; }
    p { color: #b9a9e8; line-height: 1.55; font-size: .96rem; margin-bottom: 26px; }
    .btn {
      display: inline-block; background: #F5C518; color: #160c33; text-decoration: none;
      font-weight: 800; font-size: .95rem; padding: 12px 22px; border: 0; border-radius: 11px; cursor: pointer;
    }
    .btn:hover { background: #ffd748; }
    .links { margin-top: 22px; font-size: .85rem; }
    .links a { color: #9a8bd0; text-decoration: none; margin: 0 10px; }
    .links a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="crown" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE9A8"/><stop offset=".5" stop-color="#F5C518"/><stop offset="1" stop-color="#C6960C"/>
        </linearGradient>
      </defs>
      <path d="M14 74 L9 33 L31 55 L50 23 L69 55 L91 33 L86 74 Z" fill="url(#g)" stroke="#8a6a00" stroke-width="1" stroke-linejoin="round"/>
      <rect x="12" y="73" width="76" height="13" rx="4" fill="url(#g)" stroke="#8a6a00" stroke-width="1"/>
      <circle cx="9" cy="31" r="4.6" fill="#FFF3C8"/><circle cx="50" cy="20" r="5.6" fill="#FF6E8E"/><circle cx="91" cy="31" r="4.6" fill="#FFF3C8"/>
    </svg>
    <div class="tag">◈ No connection</div>
    <h1>You're offline</h1>
    <p>Chess City is out of range right now. Any games and pages you've already opened
       still work — the rest will return the moment your signal does.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="links">
      <a href="/">P&JCC home</a>·<a href="/games/">Games</a>
    </div>
  </div>
</body>
</html>
