---
layout: default
---

<div class="wm-header">
  <div class="wm-eyebrow">PJCC World Atlas</div>
  <h1 class="wm-title">The Known World</h1>
  <p class="wm-sub">From Checker Town to Chess City — and the sea between them.</p>
</div>

<div class="world-state-banner" id="world-state-banner">
  <div class="world-state-eyebrow">◈ World State — Current Dispatch</div>
  <div class="world-state-text" id="world-state-text">Loading...</div>
  <div class="world-state-date" id="world-state-date"></div>
</div>

<div class="wm-wrap">
  <div class="wm-svg-container" style="position:relative;">
    {{ content }}

    <!-- Info panel injected by JS -->
    <div class="wm-info-panel" id="wm-panel">
      <button class="wm-info-close" id="wm-close" aria-label="Close">✕</button>
      <div class="wm-info-type" id="wm-type"></div>
      <h2 class="wm-info-name" id="wm-name"></h2>
      <p class="wm-info-desc" id="wm-desc"></p>
      <a href="#" class="wm-info-link" id="wm-link">Explore →</a>
      <div id="mystery-terminal" style="display:none;margin-top:14px;">
        <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(0,255,65,0.55);letter-spacing:0.14em;margin-bottom:6px;">◈ TERMINAL ACTIVE — ENTER ACCESS CODE</div>
        <input id="mystery-input" type="text" maxlength="6"
          style="background:#030a02;border:1px solid rgba(0,255,65,0.35);color:#00ff41;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.14em;padding:6px 10px;width:100%;box-sizing:border-box;border-radius:3px;outline:none;text-transform:uppercase;"
          placeholder="_ _ _ _ _ _" autocomplete="off">
        <div id="mystery-result" style="font-family:'Share Tech Mono',monospace;font-size:11px;color:#00ff41;margin-top:8px;line-height:1.6;"></div>
      </div>
    </div>
  </div>

  <div class="wm-legend">
    <div class="wm-legend-item"><div class="wm-legend-dot" style="background:#b87333;"></div>Checker Town / Mainland</div>
    <div class="wm-legend-item"><div class="wm-legend-dot" style="background:#F5C518;"></div>Chess City</div>
    <div class="wm-legend-item"><div class="wm-legend-dot" style="background:#4a90c4;"></div>The Sea</div>
    <div class="wm-legend-item"><div class="wm-legend-dot" style="background:#5a9e6a;"></div>Island</div>
    <div class="wm-legend-item"><div class="wm-legend-dot" style="background:rgba(140,80,200,0.6);"></div>Mystery</div>
  </div>
</div>

<script>
var locations = {
  'checker-town': {
    type: 'City',
    name: 'Checker Town',
    desc: 'A struggling community where checker pieces once fell from the sky. Gritty, grid-patterned, and full of people chasing something they can\'t name.',
    link: '{{ "/locations/checker-town/" | relative_url }}'
  },
  'sand-mines': {
    type: 'Workplace',
    name: 'The Sand Mines',
    desc: 'Where the Father works. Deep, dark, and exhausting. The kind of place that makes you understand why someone would want to leave.',
    link: '{{ "/locations/sand-mines/" | relative_url }}'
  },
  'the-sea': {
    type: 'Landmark',
    name: 'The Sea',
    desc: 'The vast water between Checker Town and Chess City. Dangerous, beautiful, and full of things the maps don\'t show.',
    link: '{{ "/locations/the-sea/" | relative_url }}'
  },
  'shogi-island': {
    type: 'Island',
    name: 'Shogi Island',
    desc: 'A stop along the journey. Different rules, different customs. Chess here looks nothing like it does back home.',
    link: '{{ "/locations/shogi-island/" | relative_url }}'
  },
  'mystery-city': {
    type: 'Unknown',
    name: 'Mystery City',
    desc: 'Something is out there. The maps show a shape. The shape has a name. That\'s all anyone knows for now.',
    link: '{{ "/locations/" | relative_url }}'
  },
  'chess-city': {
    type: 'City',
    name: 'Chess City',
    desc: 'The destination. The gleaming place across the sea. Whether it lives up to the dream is a question the whole story is built around.',
    link: '{{ "/locations/chess-city/" | relative_url }}'
  },
  'chess-city-elementary': {
    type: 'Landmark',
    name: 'Chess City Elementary',
    desc: 'Where young chess prodigies train. Where the Rival came from. A building full of pressure and prodigies.',
    link: '{{ "/locations/chess-city-elementary/" | relative_url }}'
  }
};

function openPanel(key) {
  var loc = locations[key];
  if (!loc) return;
  document.getElementById('wm-type').textContent = loc.type;
  document.getElementById('wm-name').textContent = loc.name;
  document.getElementById('wm-desc').textContent = loc.desc;
  var link = document.getElementById('wm-link');
  link.href = loc.link;
  link.textContent = loc.name === 'Mystery City' ? '? ? ?' : 'Explore →';
  document.getElementById('wm-panel').classList.add('is-open');
}

document.getElementById('wm-close').addEventListener('click', function() {
  document.getElementById('wm-panel').classList.remove('is-open');
});

var _currentLoc = null;
function openPanel(key) {
  _currentLoc = key;
  var loc = locations[key];
  if (!loc) return;
  document.getElementById('wm-type').textContent = loc.type;
  document.getElementById('wm-name').textContent = loc.name;
  document.getElementById('wm-desc').textContent = loc.desc;
  var link = document.getElementById('wm-link');
  link.href = loc.link;
  link.textContent = loc.name === 'Mystery City' ? '? ? ?' : 'Explore →';
  var mt = document.getElementById('mystery-terminal');
  var mi = document.getElementById('mystery-input');
  var mr = document.getElementById('mystery-result');
  if (mt) { mt.style.display = key === 'mystery-city' ? 'block' : 'none'; }
  if (mi) { mi.value = ''; }
  if (mr) { mr.textContent = ''; }
  document.getElementById('wm-panel').classList.add('is-open');
}

document.querySelectorAll('[data-loc]').forEach(function(el) {
  el.addEventListener('click', function() { openPanel(el.getAttribute('data-loc')); });
});

// #17 — Mystery City QD5 terminal
(function() {
  var input = document.getElementById('mystery-input');
  var result = document.getElementById('mystery-result');
  if (!input || !result) return;
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var val = input.value.trim().toUpperCase();
      if (val === 'QD5') {
        try { localStorage.setItem('frag_qd5', '1'); } catch(ex) {}
        result.style.color = '#00ff41';
        result.innerHTML = 'ACCESS GRANTED<br>The shape on the map has a name.<br>The name has a history.<br>The history is classified.<br><span style="opacity:0.5;font-size:9px;">— Fragment Qd5 recovered —</span>';
      } else {
        result.style.color = 'rgba(255,80,80,0.7)';
        result.textContent = 'ACCESS DENIED — Code invalid.';
      }
    }
  });
})();

// #30 — World State summary
(function() {
  var states = [
    'Checker Town border quiet. No vessel activity reported. Sand Mines at 60% capacity.',
    'Chess City tournament registrations open. Ferry service to Shogi Island delayed — third week.',
    'Interplanetary Construction Co. vessel debris confirmed 40km offshore. Authorities investigating.',
    'Checker piece black market activity elevated in Sector 7. Civic Hall closed for repairs.',
    'Princess spotted near the old crash site at dusk. No confrontation. Observation ongoing.',
    'Heavy fog over The Sea. All crossings postponed. Radio silence from the eastern route.',
    'Chess City Leafs advance in tournament. Checker Town youth league semifinal this evening.'
  ];
  var day = new Date().getDay();
  var el = document.getElementById('world-state-text');
  var de = document.getElementById('world-state-date');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  if (el) el.textContent = states[day];
  if (de) de.textContent = days[day].toUpperCase() + ' DISPATCH — ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
})();
</script>
