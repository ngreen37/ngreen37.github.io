---
layout: default
---

<div class="character-top-nav">
  <a href="{{ '/locations/' | relative_url }}" class="back-btn">&larr; Back to Locations</a>
  {% assign evo_slug = page.name | remove: '.md' %}
  <a href="/evolutions/{{ evo_slug }}/" class="evo-link-btn">Evolution Log &rarr;</a>
</div>

<article class="location-card">

  <header class="location-header">
    <div class="location-header-text">
      <h1 class="location-name">{{ page.title }}</h1>
    </div>
    {% if page.location_type %}
      <span class="location-type-badge">{{ page.location_type }}</span>
    {% endif %}
  </header>

  <div class="location-art">
    <div class="location-art-inner">
      <span class="location-art-icon">&#9812;</span>
      <span class="location-art-label">Art / Map Coming Soon</span>
    </div>
  </div>

  <div id="loc-weather-slot"></div>

  <div class="location-details">
    {{ content }}
  </div>

</article>

<script>
(function() {
  var slot = document.getElementById('loc-weather-slot');
  if (!slot) return;
  var name = document.querySelector('.location-name');
  var loc = name ? name.textContent.trim().toLowerCase() : '';
  var weather = {
    'checker town':       { icon: '🌫', temp: '58°F / 14°C', cond: 'Overcast. Ash fog advisory in effect. Visibility low in Sector 3.' },
    'chess city':         { icon: '☀', temp: '72°F / 22°C', cond: 'Clear skies. Game-day visibility excellent. Crowds expected downtown.' },
    'shogi island':       { icon: '🌊', temp: '79°F / 26°C', cond: 'Warm and humid. Sea winds from the east. 将棋の島: 晴れ。東からの風。' },
    'the sea':            { icon: '⛈', temp: '55°F / 13°C', cond: 'Rough swells — 14-ft waves. All vessels advised to stand down.' },
    'the sand mines':     { icon: '🌫', temp: '52°F / 11°C', cond: 'Underground. Air quality poor. Dust reported in shafts 3 through 7.' },
    'mystery city':       { icon: '░', temp: '???', cond: 'Weather data unavailable. All sensors offline. Do not approach.' },
    'chess city elementary': { icon: '🌤', temp: '68°F / 20°C', cond: 'Partly cloudy. Tournament conditions nominal. Indoor courts operational.' }
  };
  var w = weather[loc];
  if (!w) return;
  slot.innerHTML = '<div class="loc-weather"><span class="loc-weather-icon">' + w.icon + '</span><div class="loc-weather-data"><span class="loc-weather-label">◈ Atmospheric Conditions</span><span class="loc-weather-temp">' + w.temp + '</span><span class="loc-weather-cond">' + w.cond + '</span></div></div>';
})();
</script>

<script>
(function() {
  var details = document.querySelector('.location-details');
  if (!details) return;
  var els = details.querySelectorAll('p, h2, ul, li');
  els.forEach(function(el) { el.classList.add('ink-reveal'); });
  if (!('IntersectionObserver' in window)) {
    els.forEach(function(el) { el.classList.add('is-visible'); });
    return;
  }
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) { e.target.classList.add('is-visible'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
  els.forEach(function(el) { obs.observe(el); });
})();
</script>
